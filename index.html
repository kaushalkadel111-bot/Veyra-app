<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Veyra</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!--
    LOAD ORDER MATTERS — all UMD globals must be available before
    Babel compiles and executes the JSX block.

    FIX 1: React 18 UMD — pinned exact versions (no @18 alias which unpkg
            sometimes redirects unreliably)
    FIX 2: Framer Motion — must use the /dist/framer-motion.umd.js build.
            The plain framer-motion.js build does NOT expose window.FramerMotion.
    FIX 3: Lucide — pinned to 0.460.0, "latest" on unpkg is often stale/broken.
    FIX 4: Babel standalone loaded LAST so it transpiles JSX only after all
            globals exist. The text/babel script below runs after DOMContentLoaded
            which is guaranteed to be after all synchronous <script> tags.
  -->

  <!-- 1. React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <!-- 2. Framer Motion UMD (exposes window.FramerMotion) -->
  <script src="https://unpkg.com/framer-motion@11.3.31/dist/framer-motion.umd.js" crossorigin></script>

  <!-- 3. Lucide (pinned) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js" crossorigin></script>

  <!-- 4. Babel — comes last -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #050508;
      --bg2:       #0c0c12;
      --bg3:       #13131c;
      --surface:   #1a1a26;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.13);
      --cyan:      #00e5ff;
      --cyan-dim:  rgba(0,229,255,0.12);
      --cyan-glow: rgba(0,229,255,0.28);
      --pink:      #ff2d6d;
      --pink-dim:  rgba(255,45,109,0.15);
      --purple:    #7b61ff;
      --text:      #f0f0f8;
      --text2:     #8888aa;
      --text3:     #50506a;
      --fd:        'Bebas Neue', sans-serif;
      --fb:        'DM Sans', sans-serif;
      --fm:        'JetBrains Mono', monospace;
    }
    html, body, #root {
      width:100%; height:100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--fb);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    ::-webkit-scrollbar { display:none; }
    input, button, textarea { font-family: var(--fb); outline:none; }
    button { cursor:pointer; }

    /* ── Loading splash (shown while CDNs boot) ── */
    #splash {
      position:fixed; inset:0; z-index:9999;
      background:var(--bg);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px;
    }
    #splash-logo {
      font-family:'Bebas Neue',sans-serif;
      font-size:52px; letter-spacing:6px;
      background:linear-gradient(135deg,#00e5ff,#7b61ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    #splash-ring {
      width:32px; height:32px; border-radius:50%;
      border:3px solid rgba(0,229,255,0.2);
      border-top-color:#00e5ff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #splash-err { color:#ff5f5f; font-size:13px; text-align:center; padding:0 24px; display:none; }

    /* ── Glassmorphism ── */
    .glass {
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      border:1px solid var(--border2);
    }
    .glass-dark {
      background:rgba(5,5,8,0.88);
      backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
      border:1px solid var(--border);
    }

    /* ── Noise + scanlines ── */
    body::before {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity:0.5;
    }
    body::after {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);
    }

    .app-shell { position:relative; z-index:1; width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }

    /* ── Feed ── */
    .feed-scroll { overflow-y:scroll; scroll-snap-type:y mandatory; height:100%; }
    .feed-item { scroll-snap-align:start; scroll-snap-stop:always; }

    /* ── Nav ── */
    .bottom-nav {
      display:flex; justify-content:space-around; align-items:center;
      padding:10px 0 max(10px,env(safe-area-inset-bottom));
      border-top:1px solid var(--border); flex-shrink:0;
    }
    .nav-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      background:none; border:none; color:var(--text3);
      font-size:10px; font-weight:500; letter-spacing:0.5px; padding:6px 14px;
      transition:color 0.2s;
    }
    .nav-btn.active { color:var(--cyan); }
    .nav-btn-create {
      width:52px; height:52px; border-radius:16px; border:none;
      background:linear-gradient(135deg,var(--cyan),var(--purple));
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 22px var(--cyan-glow);
    }
    .nav-btn-create:active { transform:scale(0.93); }

    /* ── Auth ── */
    .input-field {
      width:100%; padding:14px 16px;
      background:var(--bg3); border:1px solid var(--border2);
      border-radius:10px; color:var(--text); font-size:15px;
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus { border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-dim); }
    .btn-primary {
      width:100%; padding:15px;
      background:linear-gradient(135deg,var(--cyan),var(--purple));
      border:none; border-radius:12px; color:#050508;
      font-size:15px; font-weight:700; letter-spacing:0.5px;
      transition:opacity 0.2s,transform 0.15s;
    }
    .btn-primary:active { transform:scale(0.98); opacity:0.9; }
    .btn-ghost { background:none; border:none; color:var(--text2); font-size:14px; transition:color 0.2s; }
    .btn-ghost:hover { color:var(--cyan); }

    /* ── Cards ── */
    .video-card { position:relative; width:100%; overflow:hidden; }
    .video-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top,rgba(5,5,8,0.92) 0%,rgba(5,5,8,0.15) 40%,transparent 70%);
      pointer-events:none;
    }
    .video-actions { position:absolute; right:12px; bottom:80px; display:flex; flex-direction:column; gap:20px; align-items:center; }
    .action-btn { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:#fff; font-size:12px; font-weight:500; }
    .action-icon { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

    /* ── Tabs ── */
    .tab { flex:1; padding:13px 8px; background:none; border:none; border-bottom:2px solid transparent; color:var(--text3); font-size:13px; font-weight:600; letter-spacing:0.3px; transition:color 0.2s,border-color 0.2s; }
    .tab.active { color:var(--cyan); border-bottom-color:var(--cyan); }

    /* ── Profile ── */
    .stat-box { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:16px 8px; border-right:1px solid var(--border); }
    .stat-box:last-child { border-right:none; }

    /* ── Gaming ── */
    .game-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px; }
    .game-card { border-radius:12px; overflow:hidden; position:relative; aspect-ratio:16/10; cursor:pointer; }

    /* ── Live ── */
    .live-badge { background:var(--pink); color:#fff; font-size:10px; font-weight:700; letter-spacing:1px; padding:3px 8px; border-radius:4px; }

    /* ── Camera ── */
    .camera-screen { position:fixed; inset:0; z-index:200; background:#000; display:flex; flex-direction:column; }
    .dur-pill { padding:8px 16px; border-radius:50px; border:none; background:rgba(255,255,255,0.1); color:#fff; font-size:13px; font-weight:600; transition:background 0.2s; flex-shrink:0; }
    .dur-pill.active { background:var(--cyan); color:#050508; }
    .rec-outer { width:80px; height:80px; border-radius:50%; border:4px solid #fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color 0.3s; }
    .rec-inner { width:60px; height:60px; border-radius:50%; background:#fff; transition:border-radius 0.3s,transform 0.3s,background 0.3s; }
    .rec-inner.on { border-radius:10px; transform:scale(0.6); background:var(--pink); }
  </style>
</head>
<body>

  <!-- Splash shown while JS/CDN loads -->
  <div id="splash">
    <div id="splash-logo">VEYRA</div>
    <div id="splash-ring"></div>
    <div id="splash-err"></div>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    // ── Destructure globals (all loaded synchronously above Babel) ────────────
    const { useState, useEffect, useRef, useCallback } = React;
    // FramerMotion is the correct global name for the UMD build
    const { motion, AnimatePresence } = FramerMotion;

    // ── Tiny SVG icon renderer using Lucide UMD ───────────────────────────────
    function Icon({ name, size=20, color="currentColor", sw=1.8 }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current) return;
        // Convert camelCase → PascalCase for lucide key lookup
        const key = name.charAt(0).toUpperCase() + name.slice(1);
        const iconDef = lucide[key];
        if (!iconDef) return;
        ref.current.innerHTML = "";
        const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
        svg.setAttribute("width",size); svg.setAttribute("height",size);
        svg.setAttribute("viewBox","0 0 24 24"); svg.setAttribute("fill","none");
        svg.setAttribute("stroke",color); svg.setAttribute("stroke-width",sw);
        svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round");
        // iconDef[2] is the children array in lucide UMD format
        const children = iconDef[2] || [];
        children.forEach(([tag, attrs]) => {
          const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
          Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
          svg.appendChild(el);
        });
        ref.current.appendChild(svg);
      }, [name, size, color, sw]);
      return <span ref={ref} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:0,flexShrink:0}} />;
    }

    // ── Spinner ───────────────────────────────────────────────────────────────
    function Spinner({ size=24, color="var(--cyan)" }) {
      return (
        <motion.div animate={{rotate:360}} transition={{repeat:Infinity,duration:0.8,ease:"linear"}}
          style={{width:size,height:size,borderRadius:"50%",border:`2px solid ${color}22`,borderTopColor:color}} />
      );
    }

    // ── Data ──────────────────────────────────────────────────────────────────
    const GR = [
      "linear-gradient(155deg,#0d1b2a,#1b2838,#0a1220)",
      "linear-gradient(155deg,#1a0a2e,#2d1b5e,#0f0a1e)",
      "linear-gradient(155deg,#0a1628,#0d2640,#060e18)",
      "linear-gradient(155deg,#1e0a14,#3d1428,#100508)",
      "linear-gradient(155deg,#071c1c,#0d3333,#030c0c)",
      "linear-gradient(155deg,#1a1200,#3a2800,#0c0900)",
    ];
    const FEED = [
      {id:1,user:"@solara_streams",title:"Ranked to Radiant in 48hrs — full grind VOD",views:"1.2M",grad:GR[0],dur:"18:42",cat:"Gaming"},
      {id:2,user:"@void_drift",title:"Midnight Tokyo drive — lo-fi session",views:"890K",grad:GR[4],dur:"8:14",cat:"Chill"},
      {id:3,user:"@nxcode",title:"I built a real-time whiteboard in 2 hours",views:"640K",grad:GR[1],dur:"2:07:33",cat:"Dev"},
      {id:4,user:"@solara_streams",title:"Reacting to pro player VODs — learning arc",views:"430K",grad:GR[3],dur:"44:12",cat:"Gaming"},
    ];
    const GAMES = [
      {id:1,title:"Apex Legends",viewers:"182K",grad:GR[0],streamer:"Solara"},
      {id:2,title:"Valorant",viewers:"134K",grad:GR[1],streamer:"NxCode"},
      {id:3,title:"Elden Ring",viewers:"98K",grad:GR[3],streamer:"VoidDrift"},
      {id:4,title:"CS2",viewers:"76K",grad:GR[2],streamer:"Krypt0"},
      {id:5,title:"League of Legends",viewers:"211K",grad:GR[5],streamer:"Lumina"},
      {id:6,title:"Minecraft",viewers:"55K",grad:GR[4],streamer:"PixelKing"},
    ];
    const LIVES = [
      {id:1,user:"@solara_streams",title:"RANKED GRIND — Road to Top 500",viewers:"14.2K",grad:GR[0],time:"3:12:44"},
      {id:2,user:"@lumina",title:"midnight chill stream · no mic",viewers:"3.8K",grad:GR[4],time:"0:44:01"},
      {id:3,user:"@krypt0.exe",title:"CS2 Pro Scrims — Behind the Scenes",viewers:"9.1K",grad:GR[2],time:"1:28:15"},
    ];

    // ── Hatched pattern overlay (simulates video texture) ─────────────────────
    function Hatch() {
      return <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(45deg,rgba(255,255,255,0.012) 0,rgba(255,255,255,0.012) 1px,transparent 1px,transparent 18px)",backgroundSize:"18px 18px",pointerEvents:"none"}} />;
    }

    // ════════════════════════════════════════════════════════════════════════
    // AUTH
    // ════════════════════════════════════════════════════════════════════════
    function AuthScreen({ onAuth }) {
      const [mode,setMode]   = useState("login");
      const [email,setEmail] = useState("");
      const [pass,setPass]   = useState("");
      const [user,setUser]   = useState("");
      const [loading,setLoading] = useState(false);
      const [err,setErr]     = useState("");

      const submit = async () => {
        setErr("");
        if(!email||!pass){setErr("Please fill all fields."); return;}
        if(mode==="signup"&&!user){setErr("Username required."); return;}
        setLoading(true);
        await new Promise(r=>setTimeout(r,900));
        setLoading(false);
        const u = user||email.split("@")[0];
        onAuth({email, username:u, handle:"@"+u.toLowerCase().replace(/\s+/g,"_")});
      };

      return (
        <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",padding:20,
          background:"radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(123,97,255,0.07) 0%,transparent 50%),var(--bg)"}}>
          <motion.div className="glass" initial={{opacity:0,y:24,scale:0.97}} animate={{opacity:1,y:0,scale:1}}
            transition={{duration:0.45,ease:[0.22,1,0.36,1]}}
            style={{width:"100%",maxWidth:420,borderRadius:24,padding:"40px 32px"}}>

            <div style={{textAlign:"center",marginBottom:30}}>
              <div style={{fontFamily:"var(--fd)",fontSize:48,letterSpacing:5,background:"linear-gradient(135deg,var(--cyan),var(--purple))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1}}>VEYRA</div>
              <div style={{color:"var(--text3)",fontSize:11,letterSpacing:2.5,marginTop:8,textTransform:"uppercase"}}>Stream · Create · Connect</div>
            </div>

            <div style={{display:"flex",background:"var(--bg3)",borderRadius:10,padding:4,marginBottom:22}}>
              {["login","signup"].map(m=>(
                <button key={m} onClick={()=>{setMode(m);setErr("");}}
                  style={{flex:1,padding:"9px 0",borderRadius:8,border:"none",fontSize:13,fontWeight:600,letterSpacing:0.3,
                    background:mode===m?"var(--surface)":"none",color:mode===m?"var(--text)":"var(--text3)",transition:"all 0.2s"}}>
                  {m==="login"?"Sign In":"Create Account"}
                </button>
              ))}
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:11,marginBottom:18}}>
              {mode==="signup"&&<input className="input-field" placeholder="Username" value={user} onChange={e=>setUser(e.target.value)} />}
              <input className="input-field" type="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)} />
              <input className="input-field" type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} />
            </div>

            {err&&<p style={{color:"#ff5f5f",fontSize:13,marginBottom:12,textAlign:"center"}}>{err}</p>}

            <button className="btn-primary" onClick={submit} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {loading?<Spinner size={18} color="#050508"/>:(mode==="login"?"Sign In":"Create Account")}
            </button>

            <div style={{textAlign:"center",marginTop:18}}>
              <button className="btn-ghost" onClick={()=>onAuth({email:"demo@veyra.app",username:"Demo User",handle:"@demo_user"})}>
                Continue as Guest
              </button>
            </div>

            <p style={{color:"var(--text3)",fontSize:11,textAlign:"center",marginTop:22,lineHeight:1.6}}>
              By continuing you agree to Veyra's Terms of Service &amp; Privacy Policy
            </p>
          </motion.div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════════════
    // HOME FEED
    // ════════════════════════════════════════════════════════════════════════
    function FeedCard({ item, height }) {
      const [liked,setLiked]   = useState(false);
      const [likes,setLikes]   = useState(()=>Math.floor(Math.random()*80+15)*1000);
      const [saved,setSaved]   = useState(false);

      return (
        <div className="video-card feed-item" style={{height,background:item.grad}}>
          <Hatch />
          <div className="video-overlay" />

          <div style={{position:"absolute",top:16,left:16,display:"flex",gap:8}}>
            <span style={{background:"rgba(0,229,255,0.14)",border:"1px solid rgba(0,229,255,0.25)",color:"var(--cyan)",fontSize:10,fontWeight:700,letterSpacing:1.5,padding:"4px 10px",borderRadius:6}}>
              {item.cat.toUpperCase()}
            </span>
            <span style={{background:"rgba(0,0,0,0.55)",color:"var(--text2)",fontSize:11,padding:"4px 10px",borderRadius:6,fontFamily:"var(--fm)"}}>
              {item.dur}
            </span>
          </div>

          <div className="video-actions">
            <button className="action-btn" onClick={()=>{setLiked(!liked);setLikes(l=>liked?l-1:l+1);}}>
              <div className="action-icon glass"><Icon name="Heart" size={20} color={liked?"var(--pink)":"#fff"} /></div>
              <span style={{color:"#fff",fontSize:11}}>{(likes/1000).toFixed(1)}K</span>
            </button>
            <button className="action-btn">
              <div className="action-icon glass"><Icon name="MessageCircle" size={20} color="#fff" /></div>
              <span style={{color:"#fff",fontSize:11}}>{(Math.random()*8+1).toFixed(1)}K</span>
            </button>
            <button className="action-btn" onClick={()=>setSaved(!saved)}>
              <div className="action-icon glass"><Icon name="Bookmark" size={20} color={saved?"var(--cyan)":"#fff"} /></div>
              <span style={{color:"#fff",fontSize:11}}>Save</span>
            </button>
            <button className="action-btn">
              <div className="action-icon glass"><Icon name="Share2" size={20} color="#fff" /></div>
              <span style={{color:"#fff",fontSize:11}}>Share</span>
            </button>
          </div>

          <div style={{position:"absolute",bottom:24,left:16,right:80}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <div style={{width:38,height:38,borderRadius:"50%",background:"linear-gradient(135deg,var(--cyan),var(--purple))",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:14,fontWeight:700,color:"#050508"}}>
                {item.user[1].toUpperCase()}
              </div>
              <div>
                <div style={{color:"#fff",fontWeight:600,fontSize:14}}>{item.user}</div>
                <div style={{color:"var(--text2)",fontSize:12,display:"flex",alignItems:"center",gap:4}}>
                  <Icon name="Eye" size={12} color="var(--text3)" /> {item.views} views
                </div>
              </div>
              <button style={{marginLeft:"auto",padding:"6px 14px",borderRadius:20,border:"1px solid var(--border2)",background:"rgba(255,255,255,0.07)",color:"#fff",fontSize:12,fontWeight:600}}>
                Follow
              </button>
            </div>
            <p style={{color:"#fff",fontSize:14,fontWeight:500,lineHeight:1.45,textShadow:"0 1px 8px rgba(0,0,0,0.8)"}}>{item.title}</p>
          </div>
        </div>
      );
    }

    function HomeView() {
      const [tab,setTab] = useState("foryou");
      const wrapRef = useRef(null);
      const [h,setH] = useState(600);
      useEffect(()=>{
        const upd=()=>{ if(wrapRef.current) setH(wrapRef.current.offsetHeight); };
        upd(); window.addEventListener("resize",upd);
        return ()=>window.removeEventListener("resize",upd);
      },[]);

      return (
        <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
          <div style={{padding:"14px 16px 0",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <div style={{fontFamily:"var(--fd)",fontSize:28,letterSpacing:3,background:"linear-gradient(135deg,var(--cyan),var(--purple))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>VEYRA</div>
            <div style={{display:"flex",gap:14}}>
              <button style={{background:"none",border:"none"}}><Icon name="Search" size={22} color="var(--text2)" /></button>
              <button style={{background:"none",border:"none"}}><Icon name="Bell" size={22} color="var(--text2)" /></button>

    // CAMERA
    // ════════════════════════════════════════════════════════════════════════
    function CameraView({ onClose }) {
      const [rec,setRec]       = useState(false);
      const [dur,setDur]       = useState("15s");
      const [elapsed,setElap] = useState(0);
      const [ready,setReady]  = useState(false);
      const [camErr,setCamErr] = useState("");
      const [mr,setMr]         = useState(null);
      const [stream,setStream] = useState(null);
      const vRef = useRef(null);
      const tRef = useRef(null);
      const DURS = {_10:"10s",_15:"15s",_20:"20s",_1m:"1m",_5m:"5m"};
      const SECS = {"10s":10,"15s":15,"20s":20,"1m":60,"5m":300};

      useEffect(()=>{
        let s;
        (async()=>{
          try {
            s = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:true});
            setStream(s);
            if(vRef.current){vRef.current.srcObject=s; vRef.current.play();}
            setReady(true);
          } catch { setCamErr("Camera access denied — enable permissions to record."); }
        })();
        return ()=>{if(s)s.getTracks().forEach(t=>t.stop()); clearInterval(tRef.current);};
      },[]);

      const toggle=()=>{
        if(!ready)return;
        if(rec){
          clearInterval(tRef.current);
          if(mr&&mr.state!=="inactive")mr.stop();
          setRec(false); setElap(0);
        } else {
          setElap(0);
          const max=SECS[dur];
          tRef.current=setInterval(()=>{
            setElap(e=>{
              if(e+1>=max){clearInterval(tRef.current);setRec(false);return 0;}
              return e+1;
            });
          },1000);
          try{const m=new MediaRecorder(stream);m.start();setMr(m);}catch{}
          setRec(true);
        }
      };

      const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
      const pct=rec?elapsed/SECS[dur]:0;

      return (
        <div className="camera-screen">
          <div style={{flex:1,position:"relative",overflow:"hidden"}}>
            {ready
              ? <video ref={vRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover",transform:"scaleX(-1)"}}/>
              : <div style={{width:"100%",height:"100%",background:"#000",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
                  {camErr
                    ? <><Icon name="CameraOff" size={44} color="var(--text3)" /><p style={{color:"var(--text3)",fontSize:14,textAlign:"center",padding:"0 30px"}}>{camErr}</p></>
                    : <><Spinner size={32} color="var(--text3)"/><p style={{color:"var(--text3)",fontSize:14}}>Starting camera...</p></>
                  }
                </div>
            }

            {/* top controls */}
            <div style={{position:"absolute",top:0,left:0,right:0,padding:"max(16px,env(safe-area-inset-top)) 16px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"linear-gradient(to bottom,rgba(0,0,0,0.65),transparent)"}}>
              <button onClick={onClose} style={{width:38,height:38,borderRadius:"50%",background:"rgba(0,0,0,0.55)",border:"1px solid rgba(255,255,255,0.14)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name="X" size={18} color="#fff" />
              </button>
              {rec&&(
                <motion.div initial={{opacity:0}} animate={{opacity:1}}
                  style={{display:"flex",alignItems:"center",gap:8,background:"rgba(0,0,0,0.65)",padding:"6px 14px",borderRadius:20}}>
                  <motion.div animate={{opacity:[1,0,1]}} transition={{repeat:Infinity,duration:1}}
                    style={{width:8,height:8,borderRadius:"50%",background:"var(--pink)"}}/>
                  <span style={{color:"#fff",fontFamily:"var(--fm)",fontSize:13}}>{fmt(elapsed)}</span>
                </motion.div>
              )}
              <button style={{width:38,height:38,borderRadius:"50%",background:"rgba(0,0,0,0.55)",border:"1px solid rgba(255,255,255,0.14)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name="FlipHorizontal2" size={18} color="#fff" />
              </button>
            </div>

            {/* progress */}
            {rec&&(
              <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"rgba(255,255,255,0.18)"}}>
                <motion.div initial={{width:0}} animate={{width:`${pct*100}%`}} transition={{duration:0.5}}
                  style={{height:"100%",background:"linear-gradient(90deg,var(--cyan),var(--pink))"}}/>
              </div>
            )}

            {!rec&&<div style={{position:"absolute",inset:0,pointerEvents:"none",backgroundImage:"linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px)",backgroundSize:"33.33% 33.33%"}}/>}
          </div>

          <div style={{background:"rgba(0,0,0,0.92)",padding:"18px 22px max(22px,env(safe-area-inset-bottom))"}}>
            <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:26,overflowX:"auto",paddingBottom:2}}>
              {Object.values(DURS).map(d=>(
                <button key={d} className={`dur-pill${dur===d?" active":""}`} onClick={()=>!rec&&setDur(d)} style={{opacity:rec?0.45:1}}>{d}</button>
              ))}
            </div>

            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{width:54,height:54,borderRadius:10,background:"var(--surface)",border:"1px solid var(--border2)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name="Image" size={22} color="var(--text2)" />
              </div>
              <div className="rec-outer" onClick={toggle} style={{borderColor:rec?"var(--pink)":"#fff"}}>
                <div className={`rec-inner${rec?" on":""}`}/>
              </div>
              <div style={{width:54,height:54,borderRadius:10,background:"var(--surface)",border:"1px solid var(--border2)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name="Sparkles" size={22} color="var(--text2)" />
              </div>
            </div>

            <div style={{display:"flex",justifyContent:"center",gap:24,marginTop:18}}>
              {["Collab","Video","Photo","Text"].map((m,i)=>(
                <button key={m} style={{background:"none",border:"none",color:i===1?"var(--cyan)":"var(--text3)",fontSize:12,fontWeight:i===1?700:500,borderBottom:i===1?"2px solid var(--cyan)":"2px solid transparent",paddingBottom:4}}>{m}</button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════════════
    // ROOT APP
    // ════════════════════════════════════════════════════════════════════════
    const NAV = [
      {id:"home",   icon:"Home",     label:"Home"},
      {id:"gaming", icon:"Gamepad2", label:"Gaming"},
      {id:"create", icon:"Plus",     label:"",   isCreate:true},
      {id:"live",   icon:"Radio",    label:"Live"},
      {id:"profile",icon:"User",     label:"Me"},
    ];

    function App() {
      const [user,setUser]       = useState(null);
      const [view,setView]       = useState("home");
      const [camera,setCamera]   = useState(false);

      if(!user) return <AuthScreen onAuth={setUser} />;

      return (
        <div className="app-shell">
          <div style={{flex:1,overflow:"hidden",position:"relative"}}>
            <AnimatePresence mode="wait">
              <motion.div key={view}
                initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-6}}
                transition={{duration:0.16,ease:"easeOut"}}
                style={{height:"100%",overflow:"hidden"}}>
                {view==="home"    && <HomeView user={user}/>}
                {view==="gaming"  && <GamingView/>}
                {view==="live"    && <LiveView user={user}/>}
                {view==="profile" && <ProfileView user={user} onLogout={()=>{setUser(null);setView("home");}}/>}
              </motion.div>
            </AnimatePresence>
          </div>

          <div className="bottom-nav glass-dark" style={{position:"relative",zIndex:50}}>
            {NAV.map(n=>{
              if(n.isCreate) return (
                <button key="create" className="nav-btn-create" onClick={()=>setCamera(true)}>
                  <Icon name="Plus" size={26} color="#050508" sw={2.5}/>
                </button>
              );
              return (
                <button key={n.id} className={`nav-btn${view===n.id?" active":""}`} onClick={()=>setView(n.id)}>
                  <Icon name={n.icon} size={22} color={view===n.id?"var(--cyan)":"var(--text3)"} sw={view===n.id?2.2:1.8}/>
                  {n.label&&<span>{n.label}</span>}
                </button>
              );
            })}
          </div>

          <AnimatePresence>
            {camera&&(
              <motion.div initial={{y:"100%"}} animate={{y:0}} exit={{y:"100%"}}
                transition={{type:"spring",damping:28,stiffness:200}}
                style={{position:"fixed",inset:0,zIndex:200}}>
                <CameraView onClose={()=>setCamera(false)}/>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    // Hide splash and mount
    const splash = document.getElementById("splash");
    if(splash) splash.style.display="none";
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
