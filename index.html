<!DOCTYPE html>
<html lang="en">
<head>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Veyra</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (for JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Framer Motion UMD -->
  <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #050508;
      --bg2:      #0c0c12;
      --bg3:      #13131c;
      --surface:  #1a1a26;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.12);
      --cyan:     #00e5ff;
      --cyan2:    #00b8d9;
      --cyan-dim: rgba(0,229,255,0.12);
      --cyan-glow:rgba(0,229,255,0.25);
      --pink:     #ff2d6d;
      --pink-dim: rgba(255,45,109,0.15);
      --text:     #f0f0f8;
      --text2:    #8888aa;
      --text3:    #555570;
      --radius:   14px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
    }
    html, body, #root {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { display: none; }
    input, button, textarea { font-family: var(--font-body); outline: none; }
    button { cursor: pointer; }

    /* Glass */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border2);
    }
    .glass-dark {
      background: rgba(5,5,8,0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
    }

    /* Cyan glow utility */
    .glow-cyan { box-shadow: 0 0 24px var(--cyan-glow), 0 0 60px rgba(0,229,255,0.1); }
    .glow-pink  { box-shadow: 0 0 24px rgba(255,45,109,0.3); }

    /* Gradient text */
    .grad-text {
      background: linear-gradient(135deg, var(--cyan), #7b61ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Noise overlay */
    body::before {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      opacity:0.4;
    }

    /* Scan line effect */
    body::after {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }

    .app-shell {
      position: relative; z-index:1;
      width:100%; height:100%;
      display:flex; flex-direction:column;
      overflow: hidden;
    }

    /* Feed scroll */
    .feed-scroll {
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      height: 100%;
    }
    .feed-item {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* Nav */
    .bottom-nav {
      display:flex; justify-content:space-around; align-items:center;
      padding: 10px 0 max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      background:none; border:none;
      color: var(--text3);
      font-size:10px; font-weight:500; letter-spacing:0.5px;
      padding: 6px 16px;
      transition: color 0.2s;
    }
    .nav-btn.active { color: var(--cyan); }
    .nav-btn-create {
      width:52px; height:52px; border-radius:16px; border:none;
      background: linear-gradient(135deg, var(--cyan), #7b61ff);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 0 20px var(--cyan-glow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .nav-btn-create:active { transform: scale(0.93); }

    /* Auth */
    .auth-bg {
      position:fixed; inset:0; z-index:0;
      background: radial-gradient(ellipse at 30% 20%, rgba(0,229,255,0.08) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 80%, rgba(123,97,255,0.08) 0%, transparent 55%),
                  var(--bg);
    }
    .auth-card {
      width:100%; max-width:420px; padding:40px 36px;
      border-radius:24px;
    }
    .input-field {
      width:100%; padding:14px 16px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius:10px;
      color: var(--text); font-size:15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }
    .btn-primary {
      width:100%; padding:15px;
      background: linear-gradient(135deg, var(--cyan), #7b61ff);
      border:none; border-radius:12px;
      color:#050508; font-size:15px; font-weight:700; letter-spacing:0.5px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-primary:active { transform:scale(0.98); opacity:0.9; }
    .btn-ghost {
      background:none; border:none;
      color: var(--text2); font-size:14px;
      transition: color 0.2s;
    }
    .btn-ghost:hover { color: var(--cyan); }

    /* Feed card */
    .video-card {
      position:relative; width:100%;
      background: var(--bg2);
      overflow:hidden;
    }
    .video-overlay {
      position:absolute; inset:0;
      background: linear-gradient(to top, rgba(5,5,8,0.9) 0%, rgba(5,5,8,0.2) 40%, transparent 70%);
      pointer-events:none;
    }
    .video-actions {
      position:absolute; right:12px; bottom:80px;
      display:flex; flex-direction:column; gap:20px; align-items:center;
    }
    .action-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      background:none; border:none; color:#fff;
      font-size:12px; font-weight:500;
    }
    .action-icon {
      width:44px; height:44px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }

    /* Tabs */
    .tab-bar {
      display:flex; gap:0;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex:1; padding:14px 8px;
      background:none; border:none;
      color: var(--text3); font-size:13px; font-weight:600; letter-spacing:0.3px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }

    /* Profile */
    .stat-box {
      flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
      padding:16px 8px;
      border-right: 1px solid var(--border);
    }
    .stat-box:last-child { border-right:none; }

    /* Gaming grid */
    .game-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px; }
    .game-card { border-radius:12px; overflow:hidden; position:relative; aspect-ratio:16/10; }

    /* Live */
    .live-badge {
      background: var(--pink); color:#fff;
      font-size:10px; font-weight:700; letter-spacing:1px;
      padding:3px 8px; border-radius:4px;
    }

    /* Camera UI */
    .camera-screen {
      position:fixed; inset:0; z-index:200;
      background:#000;
      display:flex; flex-direction:column;
    }
    .duration-pill {
      padding:8px 16px; border-radius:50px; border:none;
      background:rgba(255,255,255,0.1); color:#fff;
      font-size:13px; font-weight:600;
      transition: background 0.2s;
    }
    .duration-pill.active {
      background: var(--cyan); color:#050508;
    }
    .record-btn-outer {
      width:80px; height:80px; border-radius:50%;
      border:4px solid #fff;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .record-btn-inner {
      width:60px; height:60px; border-radius:50%;
      background:#fff;
      transition: border-radius 0.3s, transform 0.3s;
    }
    .record-btn-inner.recording {
      border-radius:10px;
      transform:scale(0.6);
      background: var(--pink);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { motion, AnimatePresence } = FramerMotion;

    // ── Icon helper ─────────────────────────────────────────────────────────
    function Icon({ name, size = 20, color = "currentColor", strokeWidth = 1.8 }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && lucide && lucide[name]) {
          ref.current.innerHTML = "";
          const el = lucide.createElement(lucide[name]);
          el.setAttribute("width", size);
          el.setAttribute("height", size);
          el.setAttribute("stroke", color);
          el.setAttribute("stroke-width", strokeWidth);
          el.setAttribute("fill", "none");
          el.setAttribute("stroke-linecap", "round");
          el.setAttribute("stroke-linejoin", "round");
          ref.current.appendChild(el);
        }
      }, [name, size, color, strokeWidth]);
      return <span ref={ref} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:0}} />;
    }

    // ── Spinner ──────────────────────────────────────────────────────────────
    function Spinner({ size = 24, color = "var(--cyan)" }) {
      return (
        <motion.div
          animate={{ rotate: 360 }}
          transition={{ repeat: Infinity, duration: 0.8, ease: "linear" }}
          style={{ width: size, height: size, borderRadius: "50%", border: `2px solid ${color}22`, borderTopColor: color }}
        />
      );
    }

    // ── Gradient backgrounds for mock video cards ────────────────────────────
    const GRADIENTS = [
      "linear-gradient(160deg,#0d1b2a,#1b2838,#162032)",
      "linear-gradient(160deg,#1a0a2e,#2d1b5e,#0f0a1e)",
      "linear-gradient(160deg,#0a1628,#0d2640,#091220)",
      "linear-gradient(160deg,#1e0a14,#3d1428,#100508)",
      "linear-gradient(160deg,#071c1c,#0d3333,#040e0e)",
      "linear-gradient(160deg,#1c1200,#3d2a00,#100900)",
    ];

    const MOCK_USERS = [
      { handle:"@solara_streams",name:"Solara", followers:"2.4M", following:"340", likes:"18.2M", bio:"Professional streamer · FPS specialist · Ranked Top 0.1%" },
      { handle:"@nxcode",        name:"NxCode", followers:"890K", following:"121", likes:"6.1M",  bio:"Dev & Creator · Building in public · TypeScript nerd" },
      { handle:"@void_drift",    name:"Void",   followers:"1.1M", following:"88",  likes:"9.4M",  bio:"Chill vibes & city nightscapes · LA based" },
    ];

    const MOCK_FEED = [
      { id:1, user:"@solara_streams", title:"Ranked to Radiant in 48hrs — full grind VOD", views:"1.2M", grad: GRADIENTS[0], dur:"18:42", category:"Gaming" },
      { id:2, user:"@void_drift",     title:"Midnight Tokyo drive — lo-fi session",         views:"890K", grad: GRADIENTS[4], dur:"8:14",  category:"Chill" },
      { id:3, user:"@nxcode",         title:"I built a real-time whiteboard in 2 hours",    views:"640K", grad: GRADIENTS[1], dur:"2:07:33",category:"Dev" },
      { id:4, user:"@solara_streams", title:"Reacting to pro player VODs — learning arc",   views:"430K", grad: GRADIENTS[3], dur:"44:12", category:"Gaming" },
    ];

    const MOCK_GAMES = [
      { id:1, title:"Apex Legends",      viewers:"182K", grad:GRADIENTS[0], streamer:"Solara" },
      { id:2, title:"Valorant",          viewers:"134K", grad:GRADIENTS[1], streamer:"NxCode" },
      { id:3, title:"Elden Ring",        viewers:"98K",  grad:GRADIENTS[3], streamer:"VoidDrift" },
      { id:4, title:"CS2",               viewers:"76K",  grad:GRADIENTS[2], streamer:"Krypt0" },
      { id:5, title:"League of Legends", viewers:"211K", grad:GRADIENTS[5], streamer:"Lumina" },
      { id:6, title:"Minecraft",         viewers:"55K",  grad:GRADIENTS[4], streamer:"PixelKing" },
    ];

    const MOCK_LIVE = [
      { id:1, user:"@solara_streams", title:"RANKED GRIND — Road to Top 500",       viewers:"14.2K", grad:GRADIENTS[0], duration:"3:12:44" },
      { id:2, user:"@lumina",         title:"midnight chill stream ♡ no mic",        viewers:"3.8K",  grad:GRADIENTS[4], duration:"0:44:01" },
      { id:3, user:"@krypt0.exe",     title:"CS2 Pro Scrims — Behind the Scenes",   viewers:"9.1K",  grad:GRADIENTS[2], duration:"1:28:15" },
    ];

    // ════════════════════════════════════════════════════════════════════════
    // AUTH SCREEN
    // ════════════════════════════════════════════════════════════════════════
    function AuthScreen({ onAuth }) {
      const [mode, setMode]       = useState("login"); // login | signup
      const [email, setEmail]     = useState("");
      const [password, setPassword] = useState("");
      const [username, setUsername] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError]     = useState("");

      const handleSubmit = async () => {
        setError("");
        if (!email || !password) { setError("Please fill all fields."); return; }
        if (mode === "signup" && !username) { setError("Username required."); return; }
        setLoading(true);
        await new Promise(r => setTimeout(r, 1000));
        setLoading(false);
        onAuth({ email, username: username || email.split("@")[0], handle: "@" + (username || email.split("@")[0]).toLowerCase().replace(/\s/g,"_") });
      };

      return (
        <div style={{ position:"fixed", inset:0, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
          <div className="auth-bg" />

          {/* Cyan orb */}
          <div style={{ position:"absolute", top:"-10%", left:"-5%", width:400, height:400, borderRadius:"50%", background:"radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%)", pointerEvents:"none" }} />
          <div style={{ position:"absolute", bottom:"-5%", right:"-5%", width:350, height:350, borderRadius:"50%", background:"radial-gradient(circle, rgba(123,97,255,0.07) 0%, transparent 70%)", pointerEvents:"none" }} />

          <motion.div
            className="glass-dark auth-card"
            initial={{ opacity:0, y:30, scale:0.97 }}
            animate={{ opacity:1, y:0, scale:1 }}
            transition={{ duration:0.5, ease:[0.22,1,0.36,1] }}
            style={{ position:"relative", zIndex:1 }}
          >
            {/* Logo */}
            <div style={{ textAlign:"center", marginBottom:32 }}>
              <div style={{ fontFamily:"var(--font-display)", fontSize:44, letterSpacing:4, background:"linear-gradient(135deg,var(--cyan),#7b61ff)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", lineHeight:1 }}>
                VEYRA
              </div>
              <div style={{ color:"var(--text3)", fontSize:12, letterSpacing:2, marginTop:6, textTransform:"uppercase" }}>
                Stream · Create · Connect
              </div>
            </div>

            {/* Mode toggle */}
            <div style={{ display:"flex", background:"var(--bg3)", borderRadius:10, padding:4, marginBottom:24 }}>
              {["login","signup"].map(m => (
                <button key={m} onClick={() => { setMode(m); setError(""); }}
                  style={{ flex:1, padding:"9px 0", borderRadius:8, border:"none", fontSize:13, fontWeight:600, letterSpacing:0.5,
                    background: mode===m ? "var(--surface)" : "none",
                    color: mode===m ? "var(--text)" : "var(--text3)",
                    transition:"all 0.2s" }}>
                  {m === "login" ? "Sign In" : "Create Account"}
                </button>
              ))}
            </div>

            {/* Fields */}
            <div style={{ display:"flex", flexDirection:"column", gap:12, marginBottom:20 }}>
              {mode === "signup" && (
                <input className="input-field" placeholder="Username" value={username}
                  onChange={e => setUsername(e.target.value)} />
              )}
              <input className="input-field" type="email" placeholder="Email address" value={email}
                onChange={e => setEmail(e.target.value)} />
              <input className="input-field" type="password" placeholder="Password" value={password}
                onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleSubmit()} />
            </div>

            {error && <p style={{ color:"#ff5f5f", fontSize:13, marginBottom:14, textAlign:"center" }}>{error}</p>}

            <button className="btn-primary" onClick={handleSubmit} disabled={loading}
              style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
              {loading ? <Spinner size={18} color="#050508" /> : (mode === "login" ? "Sign In" : "Create Account")}
            </button>

            <div style={{ textAlign:"center", marginTop:20 }}>
              <button className="btn-ghost" onClick={() => {
                onAuth({ email:"demo@veyra.app", username:"Demo User", handle:"@demo_user" });
              }}>
                Continue as Guest
              </button>
            </div>

            <p style={{ color:"var(--text3)", fontSize:11, textAlign:"center", marginTop:24, lineHeight:1.5 }}>
              By continuing you agree to Veyra's Terms of Service & Privacy Policy
            </p>
          </motion.div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════════════
    // HOME FEED
    // ════════════════════════════════════════════════════════════════════════
    function FeedCard({ item, height }) {
      const [liked, setLiked] = useState(false);
      const [likes, setLikes] = useState(Math.floor(Math.random()*90+10)*1000);
      const [saved, setSaved] = useState(false);

      return (
        <div className="video-card feed-item" style={{ height, background:item.grad }}>
          {/* Simulated video frame */}
          <div style={{ position:"absolute", inset:0, background:item.grad }}>
            <div style={{ position:"absolute", inset:0, backgroundImage:"repeating-linear-gradient(45deg,rgba(255,255,255,0.01) 0px,rgba(255,255,255,0.01) 1px,transparent 1px,transparent 20px)", backgroundSize:"20px 20px" }} />
          </div>
          <div className="video-overlay" />

          {/* Category badge */}
          <div style={{ position:"absolute", top:16, left:16, display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ background:"rgba(0,229,255,0.15)", border:"1px solid var(--cyan-dim)", color:"var(--cyan)", fontSize:10, fontWeight:700, letterSpacing:1.5, padding:"4px 10px", borderRadius:6 }}>
              {item.category.toUpperCase()}
            </span>
            <span style={{ background:"rgba(0,0,0,0.5)", color:"var(--text2)", fontSize:11, padding:"4px 10px", borderRadius:6, fontFamily:"var(--font-mono)" }}>
              {item.dur}
            </span>
          </div>

          {/* Right actions */}
          <div className="video-actions">
            <button className="action-btn" onClick={() => { setLiked(!liked); setLikes(l => liked?l-1:l+1); }}>
              <div className="action-icon glass" style={{ borderColor: liked ? "var(--pink)" : undefined }}>
                <Icon name="Heart" size={20} color={liked?"var(--pink)":"#fff"} />
              </div>
              <span style={{ color:"#fff", fontSize:11 }}>{(likes/1000).toFixed(1)}K</span>
            </button>
            <button className="action-btn">
              <div className="action-icon glass"><Icon name="MessageCircle" size={20} color="#fff" /></div>
              <span style={{ color:"#fff", fontSize:11 }}>{Math.floor(Math.random()*9+1)}.{Math.floor(Math.random()*9)}K</span>
            </button>
            <button className="action-btn" onClick={() => setSaved(!saved)}>
              <div className="action-icon glass">
                <Icon name="Bookmark" size={20} color={saved?"var(--cyan)":"#fff"} />
              </div>
              <span style={{ color:"#fff", fontSize:11 }}>Save</span>
            </button>
            <button className="action-btn">
              <div className="action-icon glass"><Icon name="Share2" size={20} color="#fff" /></div>
              <span style={{ color:"#fff", fontSize:11 }}>Share</span>
            </button>
          </div>

          {/* Bottom info */}
          <div style={{ position:"absolute", bottom:24, left:16, right:80 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
              <div style={{ width:38, height:38, borderRadius:"50%", background:"linear-gradient(135deg,var(--cyan),#7b61ff)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:14, fontWeight:700, color:"#050508" }}>
                {item.user[1].toUpperCase()}
              </div>
              <div>
                <div style={{ color:"#fff", fontWeight:600, fontSize:14 }}>{item.user}</div>
                <div style={{ color:"var(--text2)", fontSize:12, display:"flex", alignItems:"center", gap:4 }}>
                  <Icon name="Eye" size={12} color="var(--text2)" /> {item.views} views
                </div>
              </div>
              <button style={{ marginLeft:"auto", padding:"6px 14px", borderRadius:20, border:"1px solid var(--border2)", background:"rgba(255,255,255,0.07)", color:"#fff", fontSize:12, fontWeight:600 }}>
                Follow
              </button>
            </div>
            <p style={{ color:"#fff", fontSize:14, fontWeight:500, lineHeight:1.4, textShadow:"0 1px 8px rgba(0,0,0,0.8)" }}>
              {item.title}
            </p>
          </div>
        </div>
      );
    }

    function HomeView() {
      const [tab, setTab] = useState("foryou");
      const containerRef = useRef(null);
      const [height, setHeight] = useState(window.innerHeight - 120);

      useEffect(() => {
        const update = () => {
          if (containerRef.current) setHeight(containerRef.current.offsetHeight);
        };
        update();
        window.addEventListener("resize", update);
        return () => window.removeEventListener("resize", update);
      }, []);

      return (

          try {
            s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" }, audio:true });
            setStream(s);
            if (videoRef.current) {
              videoRef.current.srcObject = s;
              videoRef.current.play();
            }
            setCameraReady(true);
          } catch(e) {
            setCameraError("Camera access denied. Enable camera permissions to record.");
          }
        })();
        return () => {
          if(s) s.getTracks().forEach(t => t.stop());
          clearInterval(timerRef.current);
        };
      }, []);

      const toggleRecord = () => {
        if (!cameraReady) return;
        if (recording) {
          clearInterval(timerRef.current);
          if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
          setRecording(false);
          setElapsed(0);
        } else {
          setElapsed(0);
          const maxSec = durSeconds[duration];
          timerRef.current = setInterval(() => {
            setElapsed(e => {
              if(e+1 >= maxSec) {
                clearInterval(timerRef.current);
                setRecording(false);
                return 0;
              }
              return e+1;
            });
          }, 1000);
          try {
            const mr = new MediaRecorder(stream);
            mr.start();
            setMediaRecorder(mr);
          } catch {}
          setRecording(true);
        }
      };

      const fmtTime = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
      const progress = recording ? elapsed / durSeconds[duration] : 0;

      return (
        <div className="camera-screen">
          {/* Camera viewfinder */}
          <div style={{ flex:1, position:"relative", overflow:"hidden" }}>
            {cameraReady
              ? <video ref={videoRef} autoPlay playsInline muted style={{ width:"100%",height:"100%",objectFit:"cover",transform:"scaleX(-1)" }} />
              : <div style={{ width:"100%",height:"100%",background:"#000",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12 }}>
                  {cameraError
                    ? <><Icon name="CameraOff" size={40} color="var(--text3)"/><p style={{ color:"var(--text3)", fontSize:14, textAlign:"center", padding:"0 32px" }}>{cameraError}</p></>
                    : <><Spinner size={32} color="var(--text3)"/><p style={{ color:"var(--text3)", fontSize:14 }}>Starting camera...</p></>
                  }
                </div>
            }

            {/* Top controls */}
            <div style={{ position:"absolute",top:0,left:0,right:0, padding:"max(16px,env(safe-area-inset-top)) 16px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", background:"linear-gradient(to bottom, rgba(0,0,0,0.6), transparent)" }}>
              <button onClick={onClose} style={{ width:38,height:38,borderRadius:"50%",background:"rgba(0,0,0,0.5)",border:"1px solid rgba(255,255,255,0.15)",display:"flex",alignItems:"center",justifyContent:"center" }}>
                <Icon name="X" size={18} color="#fff" />
              </button>
              {recording && (
                <motion.div initial={{ opacity:0 }} animate={{ opacity:1 }}
                  style={{ display:"flex", alignItems:"center", gap:8, background:"rgba(0,0,0,0.6)", padding:"6px 14px", borderRadius:20 }}>
                  <motion.div animate={{ opacity:[1,0,1] }} transition={{ repeat:Infinity, duration:1 }}
                    style={{ width:8,height:8,borderRadius:"50%",background:"var(--pink)" }} />
                  <span style={{ color:"#fff", fontFamily:"var(--font-mono)", fontSize:13 }}>{fmtTime(elapsed)}</span>
                </motion.div>
              )}
              <button style={{ width:38,height:38,borderRadius:"50%",background:"rgba(0,0,0,0.5)",border:"1px solid rgba(255,255,255,0.15)",display:"flex",alignItems:"center",justifyContent:"center" }}>
                <Icon name="FlipHorizontal2" size={18} color="#fff" />
              </button>
            </div>

            {/* Progress bar */}
            {recording && (
              <div style={{ position:"absolute",top:0,left:0,right:0,height:3,background:"rgba(255,255,255,0.2)" }}>
                <motion.div initial={{ width:0 }} animate={{ width:`${progress*100}%` }} transition={{ duration:0.5 }}
                  style={{ height:"100%", background:"linear-gradient(90deg,var(--cyan),var(--pink))" }} />
              </div>
            )}

            {/* Grid overlay */}
            {!recording && (
              <div style={{ position:"absolute",inset:0,pointerEvents:"none",
                backgroundImage:"linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px)",
                backgroundSize:"33.3% 33.3%" }} />
            )}
          </div>

          {/* Bottom controls */}
          <div style={{ background:"rgba(0,0,0,0.9)", padding:"20px 24px max(24px,env(safe-area-inset-bottom))" }}>
            {/* Duration selector */}
            <div style={{ display:"flex", gap:8, justifyContent:"center", marginBottom:28, overflowX:"auto", paddingBottom:4 }}>
              {durations.map(d => (
                <button key={d} className={`duration-pill${duration===d?" active":""}`}
                  onClick={() => !recording && setDuration(d)}
                  style={{ flexShrink:0, opacity:recording?0.5:1 }}>
                  {d}
                </button>
              ))}
            </div>

            {/* Record row */}
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              {/* Gallery */}
              <div style={{ width:54, height:54, borderRadius:10, background:"var(--surface)", border:"1px solid var(--border2)", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <Icon name="Image" size={22} color="var(--text2)" />
              </div>

              {/* Record button */}
              <div className="record-btn-outer" onClick={toggleRecord}
                style={{ borderColor: recording ? "var(--pink)" : "#fff" }}>
                <div className={`record-btn-inner${recording?" recording":""}`}
                  style={{ background: recording ? "var(--pink)" : "#fff" }} />
              </div>

              {/* Effects */}
              <div style={{ width:54, height:54, borderRadius:10, background:"var(--surface)", border:"1px solid var(--border2)", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <Icon name="Sparkles" size={22} color="var(--text2)" />
              </div>
            </div>

            {/* Mode tabs */}
            <div style={{ display:"flex", justifyContent:"center", gap:24, marginTop:20 }}>
              {["Collab","Video","Photo","Text"].map((m,i) => (
                <button key={m} style={{ background:"none", border:"none", color:i===1?"var(--cyan)":"var(--text3)", fontSize:12, fontWeight:i===1?700:500, borderBottom:i===1?"2px solid var(--cyan)":"2px solid transparent", paddingBottom:4 }}>
                  {m}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════════════
    // ROOT APP
    // ════════════════════════════════════════════════════════════════════════
    function App() {
      const [user, setUser]           = useState(null);
      const [view, setView]           = useState("home");
      const [showCamera, setShowCamera] = useState(false);

      const handleAuth = (u) => setUser(u);
      const handleLogout = () => { setUser(null); setView("home"); };

      const NAV = [
        { id:"home",    icon:"Home",        label:"Home"    },
        { id:"gaming",  icon:"Gamepad2",    label:"Gaming"  },
        { id:"create",  icon:"Plus",        label:"",       isCreate:true },
        { id:"live",    icon:"Radio",       label:"Live"    },
        { id:"profile", icon:"User",        label:"Me"      },
      ];

      if (!user) return <AuthScreen onAuth={handleAuth} />;

      return (
        <div className="app-shell">
          {/* Main content */}
          <div style={{ flex:1, overflow:"hidden", position:"relative" }}>
            <AnimatePresence mode="wait">
              <motion.div key={view}
                initial={{ opacity:0, y:8 }}
                animate={{ opacity:1, y:0 }}
                exit={{ opacity:0, y:-8 }}
                transition={{ duration:0.18, ease:"easeOut" }}
                style={{ height:"100%", overflow:"hidden" }}>
                {view === "home"    && <HomeView user={user} />}
                {view === "gaming"  && <GamingView />}
                {view === "live"    && <LiveView user={user} />}
                {view === "profile" && <ProfileView user={user} onLogout={handleLogout} />}
              </motion.div>
            </AnimatePresence>
          </div>

          {/* Bottom nav */}
          <div className="bottom-nav glass-dark" style={{ position:"relative", zIndex:50 }}>
            {NAV.map(n => {
              if (n.isCreate) {
                return (
                  <button key="create" className="nav-btn-create" onClick={() => setShowCamera(true)}>
                    <Icon name="Plus" size={26} color="#050508" strokeWidth={2.5} />
                  </button>
                );
              }
              return (
                <button key={n.id} className={`nav-btn${view===n.id?" active":""}`}
                  onClick={() => setView(n.id)}>
                  <Icon name={n.icon} size={22} color={view===n.id?"var(--cyan)":"var(--text3)"} strokeWidth={view===n.id?2.2:1.8} />
                  {n.label && <span>{n.label}</span>}
                </button>
              );
            })}
          </div>

          {/* Camera overlay */}
          <AnimatePresence>
            {showCamera && (
              <motion.div initial={{ opacity:0, y:"100%" }} animate={{ opacity:1, y:0 }} exit={{ opacity:0, y:"100%" }}
                transition={{ type:"spring", damping:28, stiffness:200 }}
                style={{ position:"fixed", inset:0, zIndex:200 }}>
                <CameraView onClose={() => setShowCamera(false)} />
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
