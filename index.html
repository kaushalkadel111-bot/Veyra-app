// ─── CAMERA SCREEN ────────────────────────────────────────────────────────────
function CameraScreen({ onClose, theme }) {
  const videoRef  = useRef(null);
  const mediaRef  = useRef(null);
  const streamRef = useRef(null);
  const chunksRef = useRef([]);
  const timerRef  = useRef(null);

  const [ready, setReady]       = useState(false);
  const [recording, setRec]     = useState(false);
  const [elapsed, setElapsed]   = useState(0);
  const [facing, setFacing]     = useState('user');
  const [blobUrl, setBlobUrl]   = useState(null);
  const [denied, setDenied]     = useState(false);

  const MAX = 60;

  const startCam = useCallback(async (f) => {
    try {
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: f, width:{ ideal:1280 }, height:{ ideal:720 } }, audio: true
      });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play().catch(()=>{}); }
      setReady(true);
    } catch { setDenied(true); }
  }, []);

  useEffect(() => { startCam(facing); return () => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    if (timerRef.current) clearInterval(timerRef.current);
  }; }, []);

  const startRec = () => {
    if (!streamRef.current) return;
    chunksRef.current = [];
    setBlobUrl(null);
    const mr = new MediaRecorder(streamRef.current, { mimeType:'video/webm;codecs=vp8,opus' });
    mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
    mr.onstop = () => setBlobUrl(URL.createObjectURL(new Blob(chunksRef.current, { type:'video/webm' })));
    mr.start(100);
    mediaRef.current = mr;
    setRec(true);
    setElapsed(0);
    timerRef.current = setInterval(() => setElapsed(s => {
      if (s+1 >= MAX) { stopRec(); return MAX; }
      return s+1;
    }), 1000);
  };

  const stopRec = () => {
    if (mediaRef.current && mediaRef.current.state !== 'inactive') mediaRef.current.stop();
    clearInterval(timerRef.current);
    setRec(false);
  };

  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const pct = elapsed / MAX * 100;
  const C = 2 * Math.PI * 40;

  return (
    <div style={{ position:'absolute', inset:0, background:'#000', zIndex:200,
      display:'flex', flexDirection:'column' }}>

      {/* Review overlay */}
      {blobUrl && (
        <div style={{ position:'absolute', inset:0, zIndex:300, background:'#000',
          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:20 }}>
          <video src={blobUrl} controls autoPlay loop playsInline
            style={{ width:'100%', maxHeight:'65%', objectFit:'contain' }}/>
          <div style={{ display:'flex', gap:14 }}>
            <button onClick={() => setBlobUrl(null)}
              style={{ padding:'12px 26px', borderRadius:28, ...glass, color:'#fff', fontWeight:700 }}>
              Retake
            </button>
            <a href={blobUrl} download="veyra-clip.webm"
              style={{ padding:'12px 26px', borderRadius:28,
                background:theme.grad, color:'#fff', fontWeight:700, textDecoration:'none',
                boxShadow:`0 0 20px ${theme.glow}` }}>
              Save Clip ↓
            </a>
          </div>
          <button onClick={onClose} style={{ color:'rgba(255,255,255,.35)', fontSize:13 }}>
            Back to Feed
          </button>
        </div>
      )}

      {/* Camera view */}
      <div style={{ flex:1, position:'relative', overflow:'hidden' }}>
        {denied ? (
          <div style={{ width:'100%', height:'100%', display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center', gap:14, padding:32 }}>
            <span style={{ fontSize:48 }}>📵</span>
            <p style={{ color:'#fff', fontWeight:700, fontSize:17, textAlign:'center' }}>Camera access denied</p>
            <p style={{ color:'rgba(255,255,255,.4)', fontSize:13, textAlign:'center' }}>
              Allow camera in your browser settings.
            </p>
            <button onClick={onClose} style={{ padding:'11px 28px', borderRadius:24,
              background:theme.grad, color:'#fff', fontWeight:700 }}>Back to Feed</button>
          </div>
        ) : (
          <>
            <video ref={videoRef} autoPlay muted playsInline
              style={{ width:'100%', height:'100%', objectFit:'cover',
                transform: facing==='user' ? 'scaleX(-1)' : 'none' }}/>
            <div style={{ position:'absolute', inset:0, pointerEvents:'none',
              background:'linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.4) 100%)' }}/>
          </>
        )}

        {/* Top controls */}
        <div style={{ position:'absolute', top:0, left:0, right:0, padding:'16px',
          display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <button onClick={onClose}
            style={{ width:38, height:38, borderRadius:'50%', ...glass,
              color:'#fff', fontSize:18, display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
          <div style={{ display:'flex', alignItems:'center', gap:7, ...glass,
            borderRadius:20, padding:'5px 12px',
            borderColor: recording ? theme.accent : 'rgba(255,255,255,.11)' }}>
            {recording && <div className="blink" style={{ width:8, height:8, borderRadius:'50%',
              background:'#FF2D55', boxShadow:'0 0 8px #FF2D55' }}/>}
            <span style={{ color:'#fff', fontWeight:800, fontSize:13 }}>
              {fmt(elapsed)} / {fmt(MAX)}
            </span>
          </div>
          <button onClick={() => { const f = facing==='user'?'environment':'user'; setFacing(f); startCam(f); }}
            style={{ width:38, height:38, borderRadius:'50%', ...glass,
              color:'#fff', fontSize:18, display:'flex', alignItems:'center', justifyContent:'center' }}>🔄</button>
        </div>
      </div>

      {/* Progress */}
      <div style={{ height:3, background:'rgba(255,255,255,.08)' }}>
        <div style={{ height:'100%', width:`${pct}%`, background:theme.grad, transition:'width .5s linear' }}/>
      </div>

      {/* Record controls */}
      <div style={{ padding:'22px 24px 40px', display:'flex', alignItems:'center',
        justifyContent:'space-around', background:'#080808' }}>
        <button style={{ width:48, height:48, borderRadius:'50%', ...glass,
          fontSize:20, display:'flex', alignItems:'center', justifyContent:'center' }}>📷</button>

        {/* Record ring button */}
        <button onClick={recording ? stopRec : startRec}
          style={{ position:'relative', width:82, height:82, background:'transparent',
            display:'flex', alignItems:'center', justifyContent:'center' }}>
          <svg width="82" height="82" style={{ position:'absolute', transform:'rotate(-90deg)' }}>
            <circle cx="41" cy="41" r="40" fill="none" stroke="rgba(255,255,255,.12)" strokeWidth="3"/>
            <circle cx="41" cy="41" r="40" fill="none" stroke={theme.accent} strokeWidth="3"
              strokeDasharray={C} strokeDashoffset={C - C * pct/100} strokeLinecap="round"
              style={{ transition:'stroke-dashoffset .5s linear' }}/>
          </svg>
          <div style={{
            width: recording ? 28 : 58, height: recording ? 28 : 58,
            background: recording ? theme.accent : '#fff',
            borderRadius: recording ? 6 : '50%',
            boxShadow: recording ? `0 0 20px ${theme.glow}` : '0 0 14px rgba(255,255,255,.4)',
            transition:'all .2s',
          }}/>
        </button>

        <button style={{ width:48, height:48, borderRadius:'50%', ...glass,
          fontSize:20, display:'flex', alignItems:'center', justifyContent:'center' }}>✨</button>
      </div>
    </div>
  );
}

// ─── PROGRESS BAR ─────────────────────────────────────────────────────────────
function VideoProgress({ videoRef, accent }) {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const v = videoRef.current; if (!v) return;
    const fn = () => { if (v.duration) setPct(v.currentTime/v.duration*100); };
    v.addEventListener('timeupdate', fn);
    return () => v.removeEventListener('timeupdate', fn);
  }, []);
  return (
    <div style={{ position:'absolute', bottom:0, left:0, right:0, height:2,
      background:'rgba(255,255,255,.08)', zIndex:15 }}>
      <div style={{ height:'100%', width:`${pct}%`, transition:'width .25s linear',
        background:accent, borderRadius:2 }}/>
    </div>
  );
}

// ─── VIDEO CARD ───────────────────────────────────────────────────────────────
function VideoCard({ data, isActive, theme }) {
  const vRef  = useRef(null);
  const [liked, setLiked]   = useState(false);
  const [muted, setMuted]   = useState(true);
  const [desc, setDesc]     = useState(false);
  const [hearts, setHearts] = useState([]);

  useEffect(() => {
    const v = vRef.current; if (!v) return;
    if (isActive) { v.currentTime=0; v.play().catch(()=>{}); }
    else { v.pause(); v.currentTime=0; }
  }, [isActive]);

  const doubleTap = () => {
    if (!liked) setLiked(true);
    const id = Date.now();
    setHearts(h => [...h, { id, x: 20+Math.random()*50 }]);
    setTimeout(() => setHearts(h => h.filter(x=>x.id!==id)), 1100);
  };

  return (
    <div style={{ position:'relative', width:'100%', height:'100%',
      background:'#000', overflow:'hidden' }} onDoubleClick={doubleTap}>
      <video ref={vRef} src={data.url} loop muted={muted} playsInline preload="auto"
        style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}/>

      {/* Vignette */}
      <div style={{ position:'absolute', inset:0, pointerEvents:'none',
        background:'linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.1) 35%,transparent 55%,rgba(0,0,0,.25) 100%)' }}/>

      {/* Top accent bar */}
      <div style={{ position:'absolute', top:0, left:0, right:0, height:3, background:theme.grad, zIndex:20,
        transform: isActive?'scaleX(1)':'scaleX(0)', transformOrigin:'left', transition:'transform .5s ease' }}/>

      {/* Float hearts */}
      {hearts.map(h => (
        <div key={h.id} className="float-heart" style={{ left:`${h.x}%`, bottom:'38%' }}>❤️</div>
      ))}

      {/* Vibe badge */}
      <div style={{ position:'absolute', top:76, right:13, zIndex:15, ...glass,
        borderRadius:20, padding:'4px 10px', display:'flex', alignItems:'center', gap:5,
        borderColor: theme.accent }}>
        <span style={{ fontSize:11 }}>{theme.icon}</span>
        <span style={{ fontSize:9, color:theme.accent, fontWeight:800, letterSpacing:.8, textTransform:'uppercase' }}>
          {theme.label}
        </span>
      </div>

      {/* Action rail */}
      <div style={{ position:'absolute', right:11, bottom:128, display:'flex',
        flexDirection:'column', gap:9, zIndex:10 }}>
        <GlassBtn icon={liked?'❤️':'🤍'} label={liked?'Liked':data.likes}
          accent={theme.accent} glow={theme.glow} active={liked} onClick={()=>setLiked(p=>!p)}/>
        <GlassBtn icon="💬" label={data.comments} accent={theme.accent} glow={theme.glow}/>
        <GlassBtn icon="↗️" label={data.shares} accent={theme.accent} glow={theme.glow}/>
        <GlassBtn icon={muted?'🔇':'🔊'} label={muted?'Muted':'Live'}
          accent={theme.accent} glow={theme.glow} active={!muted} onClick={()=>setMuted(p=>!p)}/>
      </div>

      {/* Creator + description */}
      <div style={{ position:'absolute', bottom:0, left:0, right:72, padding:'0 15px 30px', zIndex:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
          <div style={{ width:43, height:43, borderRadius:'50%', flexShrink:0,
            background:theme.grad, display:'flex', alignItems:'center', justifyContent:'center',
            fontWeight:900, fontSize:16, color:'#fff', boxShadow:`0 0 16px ${theme.glow}` }}>
            {data.av}
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontWeight:700, fontSize:14, color:'#fff' }}>{data.creator}</div>
            <div style={{ display:'flex', gap:5, marginTop:2, flexWrap:'wrap' }}>
              {data.tags.map(t=>(
                <span key={t} style={{ fontSize:10, color:theme.accent, fontWeight:700 }}>{t}</span>
              ))}
            </div>
          </div>
          <button style={{ background:'transparent', border:`1.5px solid ${theme.accent}`,
            borderRadius:22, padding:'5px 13px', color:theme.accent,
            fontWeight:800, fontSize:11, boxShadow:`0 0 10px ${theme.glow}`, flexShrink:0 }}>
            Follow
          </button>
        </div>
        <div onClick={()=>setDesc(p=>!p)} style={{ cursor:'pointer' }}>
          <p style={{ fontSize:12, color:'rgba(255,255,255,.8)', lineHeight:1.5, margin:0,
            display: desc?'block':'-webkit-box',
            WebkitLineClamp: desc?'unset':1, WebkitBoxOrient:'vertical',
            overflow: desc?'visible':'hidden', textOverflow:'ellipsis' }}>
            {data.desc}
            {!desc && <span style={{ color:theme.accent, marginLeft:4, fontWeight:700 }}> more</span>}
          </p>
        </div>
      </div>

      <VideoProgress videoRef={vRef} accent={theme.accent}/>
    </div>
  );
}

// ─── VIBE DIAL ────────────────────────────────────────────────────────────────
function VibeDial({ active, onChange }) {
  return (
    <div style={{ display:'flex', gap:3, borderRadius:40, padding:'4px 5px', ...glass }}>
      {Object.entries(VIBES).map(([k,t]) => {
        const on = active===k;
        return (
          <button key={k} onClick={()=>onChange(k)}
            style={{ background: on?t.grad:'transparent', border:'none', borderRadius:28,
              padding:'6px 11px', color: on?'#fff':'rgba(255,255,255,.35)',
              fontWeight:800, fontSize:11, letterSpacing:.4,
              boxShadow: on?`0 0 14px ${t.glow}`:'none',
              display:'flex', alignItems:'center', gap:4, whiteSpace:'nowrap',
              transition:'color .2s, box-shadow .2s' }}>
            <span style={{ fontSize:12 }}>{t.icon}</span>{t.label}
          </button>
        );
      })}
    </div>
  );
}

// ─── FEED SCREEN ──────────────────────────────────────────────────────────────
function FeedScreen({ user, onSignOut }) {
  const [vibe, setVibe]       = useState('hype');
  const [idx, setIdx]         = useState(0);
  const [splash, setSplash]   = useState(false);
  const [showCam, setShowCam] = useState(false);
  const [navActive, setNav]   = useState('home');

  const containerRef = useRef(null);
  const [h, setH]    = useState(window.innerHeight);
  const touchY       = useRef(null);
  const wheelBusy    = useRef(false);

  const theme = VIBES[vibe];
  const feed  = VIDEOS[vibe];

  useEffect(() => {
    const ro = new ResizeObserver(e => setH(e[0].contentRect.height));
    if (containerRef.current) ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);

  const changeVibe = (next) => {
    if (next===vibe) return;
    setVibe(next); setIdx(0); setSplash(true);
    setTimeout(()=>setSplash(false), 700);
  };

  const go = useCallback((dir) => {
    setIdx(i => Math.max(0, Math.min(feed.length-1, i+dir)));
  }, [feed.length]);

  const onTouchStart = e => { touchY.current = e.touches[0].clientY; };
  const onTouchEnd   = e => {
    const d = touchY.current - e.changedTouches[0].clientY;
    if (Math.abs(d) > 44) go(d>0?1:-1);
  };

  useEffect(() => {
    const el = containerRef.current; if (!el) return;
    const fn = e => {
      e.preventDefault();
      if (wheelBusy.current) return;
      wheelBusy.current = true;
      go(e.deltaY>0?1:-1);
      setTimeout(()=>{ wheelBusy.current=false; }, 650);
    };
    el.addEventListener('wheel', fn, { passive:false });
    return () => el.removeEventListener('wheel', fn);
  }, [go]);

  const navItems = [
    { id:'home', icon:'🏠', label:'Home' },
    { id:'explore', icon:'🔍', label:'Explore' },
    { id:'create', icon:null },
    { id:'inbox', icon:'💌', label:'Inbox' },
    { id:'me', icon:'👤', label:'Me' },
  ];

  return (
    <div ref={containerRef}
      style={{ width:'100%', height:'100%', background:'#000', position:'relative', overflow:'hidden' }}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

      {/* Feed stack */}
      <div style={{ position:'absolute', inset:0, overflow:'hidden' }}>
        <div style={{ position:'absolute', inset:0, width:'100%',
          transform:`translateY(${-idx*h}px)`, transition:'transform .45s cubic-bezier(.25,.8,.25,1)' }}>
          {feed.map((item,i) => (
            <div key={item.id} style={{ position:'absolute', top:i*h, left:0, right:0, height:h }}>
              <VideoCard data={item} isActive={i===idx} theme={theme}/>
            </div>
          ))}
        </div>
      </div>

      {/* Vibe crossfade flash */}
      {splash && (
        <div style={{ position:'absolute', inset:0, zIndex:150, pointerEvents:'none',
          background:theme.grad, opacity:.3, animation:'none',
          transition:'opacity .6s', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:8 }}>
          <span style={{ fontSize:52 }}>{theme.icon}</span>
          <span style={{ fontSize:17, fontWeight:900, color:'#fff', letterSpacing:2, textTransform:'uppercase' }}>
            {theme.label} Mode
          </span>
        </div>
      )}

      {/* Page dots */}
      <div style={{ position:'absolute', right:4, top:'50%', transform:'translateY(-50%)',
        zIndex:30, display:'flex', flexDirection:'column', gap:5, pointerEvents:'none' }}>
        {feed.map((_,i) => (
          <div key={i} style={{ width:3, borderRadius:2,
            height: i===idx ? 22 : 4,
            background: i===idx ? theme.accent : 'rgba(255,255,255,.18)',
            boxShadow: i===idx ? `0 0 8px ${theme.accent}` : 'none',
            transition:'height .3s,background .3s,box-shadow .3s' }}/>
        ))}
      </div>

      {/* TOP BAR */}
      <div style={{ position:'absolute', top:0, left:0, right:0, zIndex:100,
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'14px 13px 10px',
        background:'linear-gradient(to bottom,rgba(0,0,0,.8) 0%,transparent 100%)' }}>
        {/* Logo */}
        <div style={{ display:'flex', alignItems:'center', gap:7, flexShrink:0 }}>
          <div style={{ width:31, height:31, borderRadius:10, background:theme.grad,
            display:'flex', alignItems:'center', justifyContent:'center',
            fontWeight:900, fontSize:15, color:'#fff', fontFamily:'Georgia,serif',
            boxShadow:`0 0 14px ${theme.glow}`, transition:'box-shadow .4s' }}>V</div>
          <span style={{ fontSize:18, fontWeight:900, letterSpacing:-0.6, fontFamily:'Georgia,serif',
            background:theme.grad, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>
            Veyra
          </span>
        </div>
        <VibeDial active={vibe} onChange={changeVibe}/>
        {/* Avatar */}
        <button onClick={onSignOut}
          style={{ width:33, height:33, borderRadius:'50%', background:theme.grad,
            border:'none', color:'#fff', fontWeight:800, fontSize:13,
            boxShadow:`0 0 12px ${theme.glow}`, flexShrink:0, transition:'box-shadow .4s' }}>
          {(user.name||'G').charAt(0).toUpperCase()}
        </button>
      </div>

      {/* BOTTOM NAV */}
      <div style={{ position:'absolute', bottom:0, left:0, right:0, zIndex:100,
        display:'flex', alignItems:'center', justifyContent:'space-around',
        padding:'10px 8px 28px',
        background:'rgba(0,0,0,.78)',
        backdropFilter:'blur(22px)', WebkitBackdropFilter:'blur(22px)',
        borderTop:'0.5px solid rgba(255,255,255,.06)' }}>
        {navItems.map(item => {
          if (item.id==='create') return (
            <button key="create" onClick={()=>setShowCam(true)}
              style={{ width:56, height:56, borderRadius:'50%', background:theme.grad,
                border:'none', display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:24, boxShadow:`0 0 24px ${theme.glow},0 0 48px ${theme.dim}`,
                position:'relative', marginTop:-16, flexShrink:0, transition:'box-shadow .5s' }}>
              ➕
            </button>
          );
          const on = navActive===item.id;
          return (
            <button key={item.id} onClick={()=>setNav(item.id)}
              style={{ background:'transparent', border:'none',
                display:'flex', flexDirection:'column', alignItems:'center', gap:3,
                padding:'4px 10px', opacity:on?1:.35, transition:'opacity .2s' }}>
              <span style={{ fontSize:21 }}>{item.icon}</span>
              <span style={{ fontSize:9, fontWeight:800, letterSpacing:.4,
                color:on?theme.accent:'rgba(255,255,255,.5)', transition:'color .3s' }}>
                {item.label}
              </span>
              {on && <div style={{ width:4, height:4, borderRadius:'50%',
                background:theme.accent, boxShadow:`0 0 7px ${theme.accent}` }}/>}
            </button>
          );
        })}
      </div>

      {/* Swipe hint */}
      {idx===0 && (
        <div style={{ position:'absolute', bottom:110, left:'50%', transform:'translateX(-50%)',
          zIndex:80, pointerEvents:'none', ...glass, borderRadius:20, padding:'7px 15px',
          display:'flex', alignItems:'center', gap:7, borderColor:theme.accent,
          animation:'floatUp 1s ease-out 3s forwards' }}>
          <span style={{ fontSize:14 }}>⬆️</span>
          <span style={{ fontSize:10, color:'#fff', fontWeight:700, letterSpacing:.8 }}>SWIPE FOR MORE</span>
        </div>
      )}

      {/* Camera */}
      {showCam && <CameraScreen onClose={()=>setShowCam(false)} theme={theme}/>}
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);

  return (
    <div style={{ width:'100vw', height:'100vh', background:'#000',
      display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{
        width:'min(430px,100vw)', height:'min(932px,100vh)',
        position:'relative', background:'#000', overflow:'hidden',
        borderRadius:'clamp(0px,(100vw - 430px)*999,48px)',
        boxShadow:'0 40px 120px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04)',
      }}>
        {!user
          ? <AuthScreen onAuth={setUser}/>
          : <FeedScreen user={user} onSignOut={()=>setUser(null)}/>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
