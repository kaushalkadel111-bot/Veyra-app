<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ALL CDNs use jsDelivr (works on Vercel/GitHub, no CORS issues)
  Every version is pinned to exact release — no @latest aliases
  Load order: React → ReactDOM → Babel → app script
  Framer Motion is NOT used (the UMD global is unreliable).
  Animations use pure CSS keyframes instead — zero dependency risk.
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

<!-- 1. Tailwind via jsDelivr — stable, CORS-safe -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/base.css"/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.5/dist/index.global.js"></script>

<!-- 2. React 18 — jsDelivr, exact version -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<!-- 3. Babel standalone — JSX transformer, exact version -->

<style>
/* ── Reset ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  overscroll-behavior:none}
::-webkit-scrollbar{display:none}
input,textarea{outline:none;-webkit-appearance:none}
button{cursor:pointer;border:none;background:transparent;
  -webkit-tap-highlight-color:transparent}
textarea{resize:none}

/* ── Splash screen (shows instantly, hidden after React mounts) ── */
#splash{
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;z-index:9999;transition:opacity .4s ease;
}
#splash.hidden{opacity:0;pointer-events:none}
#splash-logo{
  width:72px;height:72px;border-radius:22px;
  background:linear-gradient(135deg,#FF2D55,#FF6B35);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;color:#fff;font-family:Georgia,serif;
  box-shadow:0 0 40px rgba(255,45,85,.5);
}
#splash-ring{
  width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(255,255,255,.12);
  border-top-color:#FF2D55;
  animation:spin .8s linear infinite;
}
#splash-err{
  display:none;color:#FF2D55;font-size:13px;font-weight:600;
  text-align:center;padding:0 32px;line-height:1.5;
}

/* ── Keyframes ───────────────────────────────────────── */
@keyframes spin    {to{transform:rotate(360deg)}}
@keyframes blink   {0%,100%{opacity:1}50%{opacity:.15}}
@keyframes floatUp {0%{transform:translateY(0);opacity:1}100%{transform:translateY(-80px);opacity:0}}
@keyframes popIn   {0%{transform:scale(0);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp {0%{transform:translateY(100%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes fadeIn  {0%{opacity:0}100%{opacity:1}}
@keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ── Utility classes ─────────────────────────────────── */
.spin       {animation:spin .8s linear infinite}
.blink      {animation:blink 1.1s ease-in-out infinite}
.float-h    {animation:floatUp 1s ease-out forwards;pointer-events:none;
             position:absolute;font-size:30px;z-index:99}
.pop-in     {animation:popIn .4s cubic-bezier(.34,1.56,.64,1) forwards}
.slide-up   {animation:slideUp .42s cubic-bezier(.22,1,.36,1) forwards}
.fade-in    {animation:fadeIn .35s ease forwards}
.grad-anim  {background-size:200% 200%;animation:gradMove 5s ease infinite}

/* ── Glassmorphism ───────────────────────────────────── */
.glass{background:rgba(12,12,12,.65);backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.10)}
.glass-light{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.13)}
.glass-dark{background:rgba(0,0,0,.82);backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);border-top:.5px solid rgba(255,255,255,.07)}

/* ── Form inputs ─────────────────────────────────────── */
.v-input{
  width:100%;padding:13px 16px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);
  color:#fff;font-size:15px;transition:border-color .2s;font-family:inherit;
}
.v-input:focus{border-color:rgba(255,45,85,.55)}
.v-input::placeholder{color:rgba(255,255,255,.28)}

/* ── Toggle switch ───────────────────────────────────── */
.tog-track{width:50px;height:28px;border-radius:14px;position:relative;
  transition:background .3s;cursor:pointer;flex-shrink:0}
.tog-thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ── Reel grid ───────────────────────────────────────── */
.reel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}

/* ── Safe area helpers ───────────────────────────────── */
.safe-top{padding-top:max(14px,env(safe-area-inset-top))}
.safe-bot{padding-bottom:max(24px,env(safe-area-inset-bottom))}
</style>
</head>
<body>

<!-- ── Instant splash (visible before JS runs) ──────── -->
<div id="splash">
  <div id="splash-logo">V</div>
  <div id="splash-ring"></div>
  <p id="splash-err"></p>

<div id="root"></div>

<!-- ── Boot guard: verify all globals loaded ─────────── -->
<script>
(function(){
  var needed=['React','ReactDOM','Babel'];
  var missing=needed.filter(function(g){return !window[g];});
  if(missing.length){
    var el=document.getElementById('splash-err');
    el.style.display='block';
    el.textContent='Failed to load: '+missing.join(', ')+
      '. Check your internet connection and reload.';
    document.getElementById('splash-ring').style.display='none';
  }
})();
</script>

// Tap-scale button — replaces Framer Motion whileTap
function Btn({onClick,style,children,scale=.88,type='button'}){
  const [tap,setTap] = useState(false);
  return (
    <button type={type} onClick={onClick}
      onPointerDown={()=>setTap(true)}
      onPointerUp={()=>setTap(false)}
      onPointerLeave={()=>setTap(false)}
      style={{transform:tap?`scale(${scale})`:'scale(1)',
        transition:'transform .12s',...style}}>
      {children}
    </button>
  );
}

function Toggle({on,onChange,accent='#30D158'}){
  return (
    <div className="tog-track" onClick={()=>onChange(!on)}
      style={{background:on?accent:'rgba(255,255,255,.15)'}}>
      <div className="tog-thumb"
        style={{transform:on?'translateX(22px)':'translateX(0)'}}/>
    </div>
  );
}

function Avatar({letter,grad,size=44,glow}){
  return (
    <div style={{width:size,height:size,borderRadius:'50%',background:grad,flexShrink:0,
      display:'flex',alignItems:'center',justifyContent:'center',
      fontWeight:900,fontSize:size*.36,color:'#fff',
      boxShadow:glow?`0 0 18px ${glow}`:undefined}}>
      {letter}
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   GLASS ACTION BUTTON (video rail)
════════════════════════════════════════════════════════ */
function GlassBtn({icon,label,accent,glow,active,onClick}){
  const [pop,setPop] = useState(false);
  const [hov,setHov] = useState(false);
  const fire = () => {
    setPop(true); setTimeout(()=>setPop(false),320); onClick&&onClick();
  };
  return (
    <button onClick={fire}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        display:'flex',flexDirection:'column',alignItems:'center',gap:4,
        background:active?glow:'rgba(12,12,12,.65)',
        border:`1px solid ${active||hov?accent:'rgba(255,255,255,.11)'}`,
        borderRadius:18,backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
        padding:'12px 9px',minWidth:52,position:'relative',overflow:'hidden',
        boxShadow:active||hov?`0 0 22px ${glow},0 0 44px ${glow}`:'0 4px 24px rgba(0,0,0,.45)',
        transform:pop?'scale(1.3)':'scale(1)',
        transition:'transform .15s,box-shadow .25s,border-color .2s',
      }}>
      <span style={{fontSize:23,lineHeight:1,
        filter:active?`drop-shadow(0 0 10px ${accent})`:'none',
        transition:'filter .2s'}}>{icon}</span>
      <span style={{fontSize:10,fontWeight:700,letterSpacing:.35,
        color:active?'#fff':'rgba(255,255,255,.6)'}}>{label}</span>
    </button>
  );
}

/* ════════════════════════════════════════════════════════
   VIDEO PROGRESS BAR
════════════════════════════════════════════════════════ */
function VideoProgress({videoRef,accent}){
  const [pct,setPct] = useState(0);
  useEffect(()=>{
    const v=videoRef.current; if(!v) return;
    const fn=()=>{ if(v.duration) setPct(v.currentTime/v.duration*100); };
    v.addEventListener('timeupdate',fn);
    return ()=>v.removeEventListener('timeupdate',fn);
  },[]);
  return (
    <div style={{position:'absolute',bottom:0,left:0,right:0,height:2,
      background:'rgba(255,255,255,.09)',zIndex:15}}>
      <div style={{height:'100%',width:`${pct}%`,background:accent,
        borderRadius:2,transition:'width .22s linear'}}/>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   VIDEO CARD
════════════════════════════════════════════════════════ */
function VideoCard({data,isActive,theme,settings}){
  const vRef = useRef(null);
  const [liked,setLiked]   = useState(false);
  const [muted,setMuted]   = useState(true);
  const [desc,setDesc]     = useState(false);
  const [saved,setSaved]   = useState(false);
  const [hearts,setHearts] = useState([]);

  useEffect(()=>{
    const v=vRef.current; if(!v) return;
    if(isActive){ v.currentTime=0; v.play().catch(()=>{}); }
    else{ v.pause(); v.currentTime=0; }
  },[isActive]);

  const doubleTap = () => {
    if(!liked) setLiked(true);
    const id=Date.now();
    setHearts(h=>[...h,{id,x:18+Math.random()*50}]);
    setTimeout(()=>setHearts(h=>h.filter(x=>x.id!==id)),1100);
  };

  return (
    <div style={{position:'relative',width:'100%',height:'100%',
      background:'#000',overflow:'hidden'}} onDoubleClick={doubleTap}>

      <video ref={vRef} src={data.url} loop muted={muted} playsInline preload="auto"
        style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>

      {/* Vignette */}
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        background:'linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.08) 32%,transparent 52%,rgba(0,0,0,.26) 100%)'}}/>

      {/* Active accent bar */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:theme.grad,
        zIndex:20,transformOrigin:'left',
        transform:isActive?'scaleX(1)':'scaleX(0)',transition:'transform .5s ease'}}/>

      {/* Just Uploaded badge */}
      {data.isNew&&(
        <div className="pop-in" style={{position:'absolute',top:14,left:14,zIndex:30,
          background:'linear-gradient(135deg,#FF2D55,#FF6B35)',borderRadius:20,
          padding:'5px 12px',display:'flex',alignItems:'center',gap:5}}>
          <span style={{fontSize:11}}>✨</span>
          <span style={{fontSize:11,color:'#fff',fontWeight:800,letterSpacing:.6}}>JUST UPLOADED</span>
        </div>
      )}

      {/* Auto-captions */}
      {settings?.captions&&isActive&&(
        <div style={{position:'absolute',bottom:165,left:16,right:82,zIndex:20,
          background:'rgba(0,0,0,.68)',borderRadius:10,padding:'7px 12px',
          backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)'}}>
          <p style={{fontSize:13,color:'#fff',lineHeight:1.4,textAlign:'center',fontWeight:500}}>
            {data.desc.slice(0,55)}…
          </p>
        </div>
      )}

      {/* Floating hearts on double-tap */}
      {hearts.map(h=>(
        <div key={h.id} className="float-h" style={{left:`${h.x}%`,bottom:'38%'}}>❤️</div>
      ))}

      {/* Vibe badge */}
      <div style={{position:'absolute',top:76,right:13,zIndex:15,
        background:'rgba(0,0,0,.52)',border:`1px solid ${theme.accent}`,
        borderRadius:20,padding:'4px 10px',
        backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)',
        display:'flex',alignItems:'center',gap:5}}>
        <span style={{fontSize:11}}>{theme.icon}</span>
        <span style={{fontSize:9,color:theme.accent,fontWeight:800,
          letterSpacing:.8,textTransform:'uppercase'}}>{theme.label}</span>
      </div>

      {/* Action rail */}
      <div style={{position:'absolute',right:11,bottom:135,
        display:'flex',flexDirection:'column',gap:9,zIndex:10}}>
        <GlassBtn icon={liked?'❤️':'🤍'} label={liked?'Liked':data.likes}
          accent={theme.accent} glow={theme.glow} active={liked}
          onClick={()=>setLiked(p=>!p)}/>
        <GlassBtn icon="💬" label={data.comments} accent={theme.accent} glow={theme.glow}/>
        <GlassBtn icon="↗️" label={data.shares}   accent={theme.accent} glow={theme.glow}/>
        <GlassBtn icon={saved?'🔖':'📌'} label={saved?'Saved':'Save'}
          accent={theme.accent} glow={theme.glow} active={saved}
          onClick={()=>setSaved(p=>!p)}/>
        <GlassBtn icon={muted?'🔇':'🔊'} label={muted?'Muted':'Live'}
          accent={theme.accent} glow={theme.glow} active={!muted}
          onClick={()=>setMuted(p=>!p)}/>
      </div>

      {/* Creator + description */}
      <div style={{position:'absolute',bottom:0,left:0,right:74,padding:'0 15px 30px',zIndex:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <Avatar letter={data.av} grad={theme.grad} glow={theme.glow} size={44}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:14,color:'#fff'}}>{data.creator}</div>
            <div style={{display:'flex',gap:5,marginTop:2,flexWrap:'wrap'}}>
              {data.tags.map(t=>(
                <span key={t} style={{fontSize:10,color:theme.accent,fontWeight:700}}>{t}</span>
              ))}
            </div>
          </div>
          <button style={{background:'transparent',border:`1.5px solid ${theme.accent}`,
            borderRadius:22,padding:'5px 13px',color:theme.accent,
            fontWeight:800,fontSize:11,flexShrink:0,
            boxShadow:`0 0 10px ${theme.glow}`}}>Follow</button>
        </div>
        <div onClick={()=>setDesc(p=>!p)} style={{cursor:'pointer'}}>
          <p style={{fontSize:12.5,color:'rgba(255,255,255,.82)',lineHeight:1.55,margin:0,
            display:desc?'block':'-webkit-box',
            WebkitLineClamp:desc?'unset':1,WebkitBoxOrient:'vertical',
            overflow:desc?'visible':'hidden',textOverflow:'ellipsis'}}>
            {data.desc}
            {!desc&&<span style={{color:theme.accent,marginLeft:4,fontWeight:700}}> more</span>}
          </p>
        </div>
      </div>

      <VideoProgress videoRef={vRef} accent={theme.accent}/>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   FEED SCREEN
════════════════════════════════════════════════════════ */
function FeedScreen({videos,settings,onOpenUpload}){
  const [vibe,setVibe]   = useState('hype');
  const [idx,setIdx]     = useState(0);
  const [splash,setSplash] = useState(false);
  const containerRef = useRef(null);
  const [h,setH]     = useState(window.innerHeight);
  const touchY       = useRef(null);
  const wheelLock    = useRef(false);
  const theme = VIBES[vibe];

  const feed = useMemo(()=>{
    const uploaded = videos.filter(v=>!v.vibe||v.vibe===vibe);
    return [...uploaded,...(SEED_VIDEOS[vibe]||[])];
  },[vibe,videos]);

  useEffect(()=>{
    const ro=new ResizeObserver(e=>setH(e[0].contentRect.height));
    if(containerRef.current) ro.observe(containerRef.current);
    return ()=>ro.disconnect();
  },[]);

  useEffect(()=>setIdx(0),[vibe]);

  const changeVibe=(next)=>{
    if(next===vibe) return;
    setVibe(next); setIdx(0); setSplash(true);
    setTimeout(()=>setSplash(false),650);
  };

  const go=useCallback((dir)=>{
    setIdx(i=>Math.max(0,Math.min(feed.length-1,i+dir)));
  },[feed.length]);

  const onTS = e=>{ touchY.current=e.touches[0].clientY; };
  const onTE = e=>{
    const d=touchY.current-e.changedTouches[0].clientY;
    if(Math.abs(d)>44) go(d>0?1:-1);
  };

  useEffect(()=>{
    const el=containerRef.current; if(!el) return;
    const fn=e=>{
      e.preventDefault();
      if(wheelLock.current) return;
      wheelLock.current=true;
      go(e.deltaY>0?1:-1);
      setTimeout(()=>{ wheelLock.current=false; },660);
    };
    el.addEventListener('wheel',fn,{passive:false});
    return ()=>el.removeEventListener('wheel',fn);
  },[go]);

  return (
    <div ref={containerRef}
      style={{width:'100%',height:'100%',background:'#000',
        position:'relative',overflow:'hidden'}}
      onTouchStart={onTS} onTouchEnd={onTE}>

      {/* Feed stack — CSS translate, no FM needed */}
      <div style={{position:'absolute',inset:0,overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,width:'100%',
          transform:`translateY(${-idx*h}px)`,
          transition:'transform .44s cubic-bezier(.25,.8,.25,1)'}}>
          {feed.map((item,i)=>(
            <div key={item.id}
              style={{position:'absolute',top:i*h,left:0,right:0,height:h}}>
              <VideoCard data={item} isActive={i===idx}
                theme={theme} settings={settings}/>
            </div>
          ))}
        </div>
      </div>

      {/* Vibe splash overlay */}
      {splash&&(
        <div style={{position:'absolute',inset:0,zIndex:150,pointerEvents:'none',
          background:theme.grad,opacity:.32,
          display:'flex',alignItems:'center',justifyContent:'center',
          flexDirection:'column',gap:8,animation:'fadeIn .2s ease'}}>
          <span style={{fontSize:54}}>{theme.icon}</span>
          <span style={{fontSize:18,fontWeight:900,color:'#fff',
            letterSpacing:2,textTransform:'uppercase'}}>{theme.label} Mode</span>
        </div>
      )}

      {/* Page position dots */}
      <div style={{position:'absolute',right:4,top:'50%',
        transform:'translateY(-50%)',zIndex:30,
        display:'flex',flexDirection:'column',gap:5,pointerEvents:'none'}}>
        {feed.map((_,i)=>(
          <div key={i} style={{width:3,borderRadius:2,
            height:i===idx?22:4,
            background:i===idx?theme.accent:'rgba(255,255,255,.18)',
            boxShadow:i===idx?`0 0 8px ${theme.accent}`:'none',
            transition:'height .3s,background .3s,box-shadow .3s'}}/>
        ))}
      </div>

      {/* Top bar */}
      <div style={{position:'absolute',top:0,left:0,right:0,zIndex:100,
        display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'max(14px,env(safe-area-inset-top)) 13px 10px',
        background:'linear-gradient(to bottom,rgba(0,0,0,.82) 0%,transparent 100%)'}}>

        <div style={{display:'flex',alignItems:'center',gap:7,flexShrink:0}}>
          <div style={{width:31,height:31,borderRadius:10,background:theme.grad,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontWeight:900,fontSize:15,color:'#fff',fontFamily:'Georgia,serif',
            boxShadow:`0 0 14px ${theme.glow}`,transition:'box-shadow .4s'}}>V</div>
          <span style={{fontSize:18,fontWeight:900,letterSpacing:-.6,fontFamily:'Georgia,serif',
            background:theme.grad,WebkitBackgroundClip:'text',
            WebkitTextFillColor:'transparent'}}>Veyra</span>
        </div>

        <VibeDial active={vibe} onChange={changeVibe}/>

        <Btn onClick={onOpenUpload}
          style={{width:34,height:34,borderRadius:10,background:theme.grad,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:18,boxShadow:`0 0 12px ${theme.glow}`,flexShrink:0}}>＋</Btn>
      </div>

      {/* Swipe hint */}
      {idx===0&&(
        <div style={{position:'absolute',bottom:110,left:'50%',
          transform:'translateX(-50%)',zIndex:80,pointerEvents:'none',
          background:'rgba(0,0,0,.55)',border:`1px solid ${theme.accent}`,
          borderRadius:20,padding:'7px 15px',
          backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)',
          display:'flex',alignItems:'center',gap:7,whiteSpace:'nowrap',
          animation:'fadeIn 1s ease 2s both'}}>
          <span style={{fontSize:13}}>⬆️</span>
          <span style={{fontSize:10,color:'#fff',fontWeight:700,letterSpacing:.8}}>
            SWIPE FOR MORE
          </span>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   CREATOR STUDIO
════════════════════════════════════════════════════════ */
function CreatorStudio({onClose,theme}){
  const videoRef  = useRef(null);
  const mediaRef  = useRef(null);
  const streamRef = useRef(null);
  const chunksRef = useRef([]);
  const timerRef  = useRef(null);

  const [ready,setReady]     = useState(false);
  const [recording,setRec]   = useState(false);
  const [elapsed,setElapsed] = useState(0);
  const [facing,setFacing]   = useState('user');
  const [blobUrl,setBlobUrl] = useState(null);
  const [denied,setDenied]   = useState(false);
  const [aiFilter,setFilter] = useState('none');
  const [dualMode,setDual]   = useState(false);
  const [beauty,setBeauty]   = useState(false);
  const [recMode,setRecMode] = useState('video');
  const MAX=60;

  const startCam=useCallback(async(f)=>{
    try{
      if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
      const s=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:f,width:{ideal:1280},height:{ideal:720}},audio:true
      });
      streamRef.current=s;
      if(videoRef.current){ videoRef.current.srcObject=s; videoRef.current.play().catch(()=>{}); }
      setReady(true);
    }catch{ setDenied(true); }
  },[]);

  useEffect(()=>{
    startCam(facing);
    return ()=>{
      if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
      if(timerRef.current) clearInterval(timerRef.current);
    };
  },[]);

  const startRec=()=>{
    if(!streamRef.current) return;
    chunksRef.current=[]; setBlobUrl(null);
    const mr=new MediaRecorder(streamRef.current,{mimeType:'video/webm;codecs=vp8,opus'});
    mr.ondataavailable=e=>{ if(e.data.size>0) chunksRef.current.push(e.data); };
    mr.onstop=()=>setBlobUrl(URL.createObjectURL(
      new Blob(chunksRef.current,{type:'video/webm'})));
    mr.start(100); mediaRef.current=mr;
    setRec(true); setElapsed(0);
    timerRef.current=setInterval(()=>setElapsed(s=>{
      if(s+1>=MAX){ stopRec(); return MAX; } return s+1;
    }),1000);
  };

  const stopRec=()=>{
    if(mediaRef.current&&mediaRef.current.state!=='inactive') mediaRef.current.stop();
    clearInterval(timerRef.current); setRec(false);
  };

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const pct=elapsed/MAX*100;
  const C=2*Math.PI*40;
  const filter=AI_FILTERS.find(f=>f.id===aiFilter)||AI_FILTERS[0];

  return (
    <div className="slide-up" style={{position:'absolute',inset:0,background:'#000',
      zIndex:300,display:'flex',flexDirection:'column'}}>

      {/* Review overlay */}
      {blobUrl&&(
        <div style={{position:'absolute',inset:0,zIndex:400,background:'#000',
          display:'flex',flexDirection:'column',alignItems:'center',
          justifyContent:'center',gap:22}}>
          <video src={blobUrl} controls autoPlay loop playsInline
            style={{width:'100%',maxHeight:'65%',objectFit:'contain'}}/>
          <div style={{display:'flex',gap:14}}>
            <Btn onClick={()=>setBlobUrl(null)}
              style={{padding:'12px 26px',borderRadius:28,
                background:'rgba(255,255,255,.08)',
                border:'1px solid rgba(255,255,255,.15)',
                color:'#fff',fontWeight:700,fontSize:14}}>Retake</Btn>
            <a href={blobUrl} download="veyra-clip.webm"
              style={{padding:'12px 26px',borderRadius:28,background:theme.grad,
                color:'#fff',fontWeight:800,fontSize:14,textDecoration:'none',
                boxShadow:`0 0 22px ${theme.glow}`}}>Save Clip ↓</a>
          </div>
          <Btn onClick={onClose}
            style={{color:'rgba(255,255,255,.35)',fontSize:13,fontWeight:600}}>
            Back to Feed
          </Btn>
        </div>
      )}

      {/* Camera view */}
      <div style={{flex:1,position:'relative',overflow:'hidden'}}>
        {denied?(
          <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',
            alignItems:'center',justifyContent:'center',gap:14,padding:32}}>
            <span style={{fontSize:52}}>📵</span>
            <p style={{color:'#fff',fontWeight:700,fontSize:17,textAlign:'center'}}>
              Camera access denied
            </p>
            <p style={{color:'rgba(255,255,255,.4)',fontSize:13,textAlign:'center'}}>

            <Btn onClick={onClose}

          </div>
        ):(
          <>

                filter:beauty?'blur(1.5px) brightness(1.08) contrast(.96)':'none'}}/>

  const [loading,setLoading] = useState(false);
  const [err,setErr]     = useState('');
  const [showPw,setShowPw] = useState(false);

  const submit = e => {
    e.preventDefault(); setErr('');
    if(!email||!pw){ setErr('Please fill all fields.'); return; }
    if(mode==='up'&&!name){ setErr('Enter a display name.'); return; }
    setLoading(true);
    // ── SUPABASE SWAP ────────────────────────────────────
    // const { data, error } = mode === 'up'
    //   ? await supabase.auth.signUp({ email, password: pw, options:{ data:{ full_name: name }}})
    //   : await supabase.auth.signInWithPassword({ email, password: pw });
    // if (error) { setErr(error.message); setLoading(false); return; }
    // onAuth(data.user);
    // ── END SWAP ─────────────────────────────────────────
    setTimeout(()=>{
      setLoading(false);
      onAuth({email,name:name||email.split('@')[0]});
    },900);
  };

  return (
    <div style={{width:'100%',height:'100%',background:'#000',display:'flex',
      alignItems:'center',justifyContent:'center',position:'relative',overflow:'hidden'}}>
      {/* Ambient blobs */}
      <div style={{position:'absolute',top:-120,left:-80,width:320,height:320,
        borderRadius:'50%',background:'rgba(255,45,85,.13)',filter:'blur(80px)',
        pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:-80,right:-60,width:260,height:260,
        borderRadius:'50%',background:'rgba(10,132,255,.10)',filter:'blur(80px)',
        pointerEvents:'none'}}/>

      <div style={{width:'100%',maxWidth:340,padding:'0 28px'}}>
        {/* Logo */}
        <div style={{textAlign:'center',marginBottom:34}}>
          <div style={{width:70,height:70,borderRadius:22,margin:'0 auto 14px',
            background:'linear-gradient(135deg,#FF2D55,#FF6B35)',
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:30,fontWeight:900,color:'#fff',fontFamily:'Georgia,serif',
            boxShadow:'0 0 38px rgba(255,45,85,.45)'}}>V</div>
          <h1 style={{fontSize:32,fontWeight:900,letterSpacing:-1,
            fontFamily:'Georgia,serif',
            background:'linear-gradient(135deg,#FF2D55,#FF6B35)',
            WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Veyra</h1>
          <p style={{color:'rgba(255,255,255,.32)',fontSize:13,marginTop:5,letterSpacing:.3}}>
            Entertainment without limits
          </p>
        </div>

        {/* Tab switcher */}
        <div style={{display:'flex',background:'rgba(255,255,255,.06)',
          borderRadius:14,padding:4,marginBottom:22,gap:4}}>
          {[['in','Sign In'],['up','Sign Up']].map(([k,l])=>(
            <Btn key={k} onClick={()=>{ setMode(k); setErr(''); }}
              style={{flex:1,padding:10,borderRadius:10,fontWeight:700,fontSize:14,
                background:mode===k?'rgba(255,255,255,.12)':'transparent',
                color:mode===k?'#fff':'rgba(255,255,255,.36)',
                boxShadow:mode===k?'0 2px 10px rgba(0,0,0,.3)':'none',
                transition:'all .2s'}}>
              {l}
            </Btn>
          ))}
        </div>

        <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:12}}>
          {mode==='up'&&(
            <input className="v-input" type="text" placeholder="Display name"
              value={name} onChange={e=>setName(e.target.value)}/>
          )}
          <input className="v-input" type="email" placeholder="Email address"
            value={email} onChange={e=>setEmail(e.target.value)}/>
          <div style={{position:'relative'}}>
            <input className="v-input" type={showPw?'text':'password'}
              placeholder="Password" value={pw}
              onChange={e=>setPw(e.target.value)}
              style={{paddingRight:48}}/>
            <Btn onClick={()=>setShowPw(p=>!p)}
              style={{position:'absolute',right:14,top:'50%',
                transform:'translateY(-50%)',
                color:'rgba(255,255,255,.38)',fontSize:18}}>
              {showPw?'🙈':'👁️'}
            </Btn>
          </div>

          {err&&(
            <p style={{color:'#FF2D55',fontSize:12,textAlign:'center',fontWeight:600}}>
              {err}
            </p>
          )}

          <Btn type="submit" onClick={submit}
            style={{marginTop:4,padding:15,borderRadius:14,fontWeight:800,fontSize:16,
              color:'#fff',letterSpacing:.3,
              background:loading?'rgba(255,45,85,.4)':'linear-gradient(135deg,#FF2D55,#FF6B35)',
              boxShadow:loading?'none':'0 0 28px rgba(255,45,85,.35)',
              display:'flex',alignItems:'center',justifyContent:'center',gap:8,
              transition:'all .3s',width:'100%'}}>
            {loading
              ?<><span className="spin" style={{width:18,height:18,
                  border:'2.5px solid rgba(255,255,255,.3)',borderTopColor:'#fff',
                  borderRadius:'50%',display:'inline-block'}}/>Signing in…</>
              :mode==='in'?'Sign In to Veyra →':'Create Account →'}
          </Btn>
        </form>

        {/* Social sign-in */}
        <div style={{marginTop:20,textAlign:'center'}}>
          <p style={{color:'rgba(255,255,255,.18)',fontSize:12,marginBottom:13}}>
            or continue with
          </p>
          <div style={{display:'flex',gap:10,justifyContent:'center'}}>
            {[['G','Google User'],['A','Apple User'],['𝕏','X User']].map(([p,n])=>(
              <Btn key={p}
                onClick={()=>onAuth({email:`${p.toLowerCase()}@veyra.app`,name:n})}
                style={{width:48,height:48,borderRadius:14,
                  background:'rgba(255,255,255,.06)',
                  border:'1px solid rgba(255,255,255,.11)',
                  color:'rgba(255,255,255,.8)',fontWeight:900,fontSize:15}}>
                {p}
              </Btn>
            ))}
          </div>
        </div>

        <Btn onClick={()=>onAuth({email:'guest@veyra.app',name:'Guest'})}
          style={{display:'block',margin:'18px auto 0',
            color:'rgba(255,255,255,.2)',fontSize:12,fontWeight:600}}>
          Skip for now
        </Btn>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   ROOT APP
════════════════════════════════════════════════════════ */
function App(){
  const [user,setUser]       = useState(null);
  const [tab,setTab]         = useState('feed');
  const [showCam,setShowCam] = useState(false);
  const [showUp,setShowUp]   = useState(false);
  const [videos,setVideos]   = useState([]); // global uploaded videos state
  const [settings,setSettings] = useState({
    dataSaver:false,captions:false,verified:false,hdr:true,haptic:true
  });

  const theme = VIBES['hype']; // chrome uses hype accent; feed manages own vibe

  // Hide splash once React is running
  useEffect(()=>{
    const el=document.getElementById('splash');
    if(el){ el.classList.add('hidden');
      setTimeout(()=>{ el.style.display='none'; },450); }
  },[]);

  const handleUpload = vid => setVideos(prev=>[vid,...prev]);

  if(!user){
    return (
      <div style={{width:'100vw',height:'100vh',background:'#000',
        display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{width:'min(430px,100vw)',height:'min(932px,100vh)',
          position:'relative',background:'#000',overflow:'hidden',
          borderRadius:'clamp(0px,(100vw - 430px)*999,48px)',
          boxShadow:'0 40px 120px rgba(0,0,0,.92),0 0 0 1px rgba(255,255,255,.04)'}}>
          <AuthScreen onAuth={setUser}/>
        </div>
      </div>
    );
  }

  return (
    <div style={{width:'100vw',height:'100vh',background:'#000',
      display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{
        width:'min(430px,100vw)',height:'min(932px,100vh)',
        position:'relative',background:'#000',overflow:'hidden',
        borderRadius:'clamp(0px,(100vw - 430px)*999,48px)',
        boxShadow:'0 40px 120px rgba(0,0,0,.92),0 0 0 1px rgba(255,255,255,.04)',
      }}>
        {/* Screen content */}
        <div style={{position:'absolute',inset:0,paddingBottom:72}}>
          {tab==='feed'&&(
            <FeedScreen videos={videos} settings={settings}
              onOpenUpload={()=>setShowUp(true)}/>
          )}
          {tab==='discover'&&<DiscoverScreen theme={theme}/>}
          {tab==='profile'&&<ProfileScreen user={user} theme={theme}/>}
          {tab==='settings'&&(
            <SettingsScreen settings={settings} onSettings={setSettings}
              user={user} theme={theme} onSignOut={()=>setUser(null)}/>
          )}
        </div>

        {/* Bottom nav always visible */}
        <BottomNav tab={tab} setTab={setTab} theme={theme}
          onCamera={()=>setShowCam(true)}/>

        {/* Modals */}
        {showCam&&(
          <CreatorStudio onClose={()=>setShowCam(false)} theme={theme}/>
        )}
        {showUp&&(
          <UploadScreen onClose={()=>setShowUp(false)}
            onUploaded={handleUpload} theme={theme}/>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
