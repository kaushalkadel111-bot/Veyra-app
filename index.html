  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #09090b;
      font-family: 'DM Sans', sans-serif;
    }
    ::-webkit-scrollbar { width: 0; background: transparent; }
    .glass {
      background: rgba(24,24,27,0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .glass-dark {
      background: rgba(9,9,11,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .glow-cyan {
      box-shadow: 0 0 24px rgba(6,182,212,0.35), 0 0 2px rgba(6,182,212,0.6);
    }
    .glow-cyan-text {
      text-shadow: 0 0 18px rgba(6,182,212,0.6);
    }
    .veyra-gradient {
      background: linear-gradient(135deg, #06b6d4 0%, #0e7490 50%, #164e63 100%);
    }
    .feed-gradient {
      background: linear-gradient(to top, rgba(9,9,11,0.98) 0%, rgba(9,9,11,0.6) 50%, transparent 100%);
    }
    .noise-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.5;
    }
    .tab-active-indicator {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 9999px; background: #06b6d4;
    }
    .record-pulse {
      animation: pulse-ring 1.4s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
      70% { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .slide-up { animation: slideUp 0.38s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.28s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .content-scroll { overflow-y: auto; height: 100%; }
    .snap-feed { scroll-snap-type: y mandatory; overflow-y: scroll; height: 100%; }
    .snap-item { scroll-snap-align: start; }
    .tribe-pill {
      white-space: nowrap;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.01em;
    }
    .tribe-pill.active {
      background: #06b6d4;
      color: #09090b;
    }
    .tribe-pill.inactive {
      background: rgba(39,39,42,0.8);
      color: #a1a1aa;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; user-select: none;
    }
    .action-btn-icon {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(24,24,27,0.72);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.18s;
    }
    .action-btn-icon:active { transform: scale(0.92); }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; flex: 1; padding: 12px 0;
      position: relative; transition: opacity 0.18s;
    }
    input, textarea {
      background: rgba(39,39,42,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #f4f4f5;
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: rgba(6,182,212,0.5); }
    .shimmer {
      background: linear-gradient(90deg, rgba(39,39,42,0.4) 25%, rgba(63,63,70,0.4) 50%, rgba(39,39,42,0.4) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>

    // ─── AUTH SCREEN ──────────────────────────────────────────────────────────────
    function AuthScreen({ onAuth }) {
      const [mode, setMode] = useState('login'); // login | signup
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      async function handleSubmit() {
        setError(''); setSuccess(''); setLoading(true);
        try {
          if (mode === 'signup') {
            const { data, error: err } = await sb.auth.signUp({ email, password, options: { data: { username } } });
            if (err) throw err;
            setSuccess('Account created! Check your email to confirm.');
            setTimeout(() => onAuth({ email, username: username || email.split('@')[0] }), 1200);
          } else {
            const { data, error: err } = await sb.auth.signInWithPassword({ email, password });
            if (err) throw err;
            onAuth({ email, username: data.user?.user_metadata?.username || email.split('@')[0] });
          }
        } catch (e) {
          // Demo fallback: allow login even if Supabase isn't configured
          if (email && password.length >= 6) {
            setSuccess(mode === 'signup' ? 'Account created!' : 'Welcome back!');
            setTimeout(() => onAuth({ email, username: username || email.split('@')[0] }), 900);
          } else {
            setError(e.message || 'Something went wrong. Try demo@veyra.app / password123');
          }
        } finally {
          setLoading(false);
        }
      }

      function handleDemo() {
        setEmail('demo@veyra.app');
        setPassword('password123');
        setTimeout(() => onAuth({ email: 'demo@veyra.app', username: 'demo.user' }), 400);

            </div>

            </div>

            <button onClick={handleSubmit} disabled={loading}

    // ─── CREATE TAB ───────────────────────────────────────────────────────────────
    function CreateTab({ onClose }) {
      const [mode, setMode] = useState('menu'); // menu | camera
      const [recording, setRecording] = useState(false);
      const [duration, setDuration] = useState('15s');
      const [cameraError, setCameraError] = useState('');
      const [elapsed, setElapsed] = useState(0);
      const [uploading, setUploading] = useState(false);
      const [uploadDone, setUploadDone] = useState(false);
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const recorderRef = useRef(null);
      const timerRef = useRef(null);
      const chunksRef = useRef([]);

      const durations = ['10s', '15s', '20s', '1m', '5m'];

      const durationMs = { '10s': 10000, '15s': 15000, '20s': 20000, '1m': 60000, '5m': 300000 };
      const durationSec = { '10s': 10, '15s': 15, '20s': 20, '1m': 60, '5m': 300 };

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          setMode('camera');
          setCameraError('');
        } catch(e) {
          setCameraError('Camera access denied. Please allow camera permission.');
        }
      }

      function stopCamera() {
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        if (timerRef.current) clearInterval(timerRef.current);
        setRecording(false); setElapsed(0); setMode('menu');
      }

      function startRecording() {
        if (!streamRef.current) return;
        chunksRef.current = [];
        const recorder = new MediaRecorder(streamRef.current);
        recorder.ondataavailable = e => chunksRef.current.push(e.data);
        recorder.start();
        recorderRef.current = recorder;
        setRecording(true); setElapsed(0);
        timerRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
        // Auto-stop at duration
        setTimeout(() => stopRecording(), durationMs[duration]);
      }

      function stopRecording() {
        if (recorderRef.current && recorderRef.current.state !== 'inactive') { recorderRef.current.stop(); }
        if (timerRef.current) clearInterval(timerRef.current);
        setRecording(false);
      }

      async function handleUpload() {
        setUploading(true);
        // Mock upload to Supabase
        try {
          await new Promise(r => setTimeout(r, 1800)); // Simulate upload delay
          // Real implementation:
          // const blob = new Blob(chunksRef.current, { type: 'video/mp4' });
          // const { data, error } = await sb.storage.from('videos').upload(`${Date.now()}.mp4`, blob);
          // await sb.from('posts').insert({ user_id: user.id, storage_path: data.path, ... });
          setUploadDone(true);
          setTimeout(() => { setUploadDone(false); stopCamera(); }, 1500);
        } finally {
          setUploading(false);
        }
      }

      useEffect(() => () => stopCamera(), []);

      const progress = durationSec[duration] > 0 ? Math.min(elapsed / durationSec[duration], 1) : 0;

      if (mode === 'menu') {
        return (
          <motion.div initial={{opacity:0,y:40}} animate={{opacity:1,y:0}} className="h-full bg-zinc-950 flex flex-col pt-14">
            <div className="flex items-center justify-between px-5 pt-4 mb-8">
              <h2 className="text-white text-2xl font-bold" style={{fontFamily:'Syne,sans-serif'}}>Create</h2>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center">
                <Icon name="X" size={15} color="#a1a1aa" />
              </button>
            </div>

            <div className="px-5 flex flex-col gap-4 flex-1">
              {/* Duration selector */}
              <div className="glass rounded-2xl p-4">
                <p className="text-zinc-400 text-xs mb-3 uppercase tracking-widest" style={{fontFamily:'DM Sans,sans-serif',letterSpacing:'0.1em'}}>Duration</p>
                <div className="flex gap-2">
                  {durations.map(d => (
                    <button key={d} onClick={() => setDuration(d)}
                      className="flex-1 py-2.5 rounded-xl text-xs font-semibold transition-all"
                      style={{
                        fontFamily:'DM Sans,sans-serif',
                        background: duration === d ? '#06b6d4' : 'rgba(39,39,42,0.6)',
                        color: duration === d ? '#09090b' : '#71717a',
                        border: duration === d ? 'none' : '1px solid rgba(255,255,255,0.07)',
                      }}>
                      {d}
                    </button>
                  ))}
                </div>
              </div>

              {/* Create options */}
              {[
                { icon: 'Camera', label: 'Record Video', sub: `Up to ${duration}`, action: startCamera, accent: true },
                { icon: 'Video', label: 'Upload Video', sub: 'From your library', action: () => {}, accent: false },
                { icon: 'Mic', label: 'Voice Post', sub: 'Audio-only post', action: () => {}, accent: false },
                { icon: 'Film', label: 'Remix', sub: 'Duet or stitch', action: () => {}, accent: false },
              ].map(item => (
                <button key={item.label} onClick={item.action}
                  className="flex items-center gap-4 p-4 rounded-2xl transition-all active:scale-98"
                  style={{
                    background: item.accent ? 'rgba(6,182,212,0.1)' : 'rgba(24,24,27,0.72)',
                    border: `1px solid ${item.accent ? 'rgba(6,182,212,0.25)' : 'rgba(255,255,255,0.06)'}`,
                    backdropFilter: 'blur(12px)',
                  }}>
                  <div className="w-12 h-12 rounded-xl flex items-center justify-center"
                    style={{background: item.accent ? 'rgba(6,182,212,0.2)' : 'rgba(39,39,42,0.8)'}}>
                    <Icon name={item.icon} size={22} color={item.accent ? '#06b6d4' : '#71717a'} />
                  </div>
                  <div className="text-left">
                    <p className="text-white text-sm font-semibold" style={{fontFamily:'Syne,sans-serif'}}>{item.label}</p>
                    <p className="text-zinc-500 text-xs mt-0.5" style={{fontFamily:'DM Sans,sans-serif'}}>{item.sub}</p>
                  </div>
                  <div className="ml-auto"><Icon name="ChevronRight" size={16} color="#52525b" /></div>
                </button>
              ))}

              {cameraError && <p className="text-red-400 text-sm text-center" style={{fontFamily:'DM Sans,sans-serif'}}>{cameraError}</p>}
            </div>
          </motion.div>
        );
      }

      // Camera view
      return (
        <motion.div initial={{opacity:0}} animate={{opacity:1}} className="relative h-full bg-black overflow-hidden">
          <video ref={videoRef} autoPlay muted playsInline className="absolute inset-0 w-full h-full object-cover" style={{transform:'scaleX(-1)'}} />

                <Icon name="X" size={18} color="white" />
              </button>
              <div className="flex items-center gap-2 glass rounded-full px-3 py-1.5">
                {recording && <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />}
                <span className="text-white text-xs font-mono">{String(Math.floor(elapsed/60)).padStart(2,'0')}:{String(elapsed%60).padStart(2,'0')}</span>
                <span className="text-zinc-500 text-xs">/ {duration}</span>
              </div>
              <button className="w-10 h-10 rounded-full glass flex items-center justify-center pointer-events-auto">

            </div>

            {/* Veyra watermark */}
            <div className="flex items-center gap-1 pl-5 pt-2">
              <Icon name="Zap" size={12} color="#06b6d4" />
              <span className="text-cyan-400 font-bold" style={{fontFamily:'Syne,sans-serif',fontSize:'12px'}}>VEYRA</span>
            </div>

            <div className="flex-1" />

            {/* Progress bar */}
            {recording && (
              <div className="mx-5 mb-4 h-1 bg-zinc-800 rounded-full overflow-hidden">
                <motion.div className="h-full bg-cyan-400 rounded-full"
                  animate={{width: `${progress * 100}%`}}
                  transition={{duration:0.5,ease:'linear'}} />
              </div>
            )}

            {/* Duration pills */}
            <div className="flex gap-2 justify-center mb-6 pointer-events-auto">
              {durations.map(d => (
                <button key={d} onClick={() => !recording && setDuration(d)}
                  className="px-3 py-1 rounded-full text-xs font-medium transition-all"
                  style={{
                    fontFamily:'DM Sans,sans-serif',
                    background: duration === d ? 'rgba(6,182,212,0.3)' : 'rgba(24,24,27,0.5)',
                    color: duration === d ? '#22d3ee' : 'rgba(255,255,255,0.5)',

                  }}>

            {/* Bottom controls */}
            <div className="flex items-center justify-around pb-12 pointer-events-auto px-10">
              <button onClick={handleUpload} disabled={!elapsed || uploading}

                <span className="text-white text-xs" style={{fontFamily:'DM Sans,sans-serif'}}>Upload</span>

            {activeTab === 'create' && (
              <motion.div key="create" className="absolute inset-0" initial={{opacity:0,scale:0.97}} animate={{opacity:1,scale:1}} exit={{opacity:0,scale:0.97}} transition={{duration:0.22}}>
                <CreateTab onClose={() => setActiveTab(prevTab)} />
              </motion.div>
            )}
            {activeTab === 'gaming' && (
              <motion.div key="gaming" className="absolute inset-0" initial={{opacity:0,y:12}} animate={{opacity:1,y:0}} exit={{opacity:0}} transition={{duration:0.22}}>
                <GamingTab />
              </motion.div>
            )}
            {activeTab === 'profile' && (
              <motion.div key="profile" className="absolute inset-0" initial={{opacity:0,y:12}} animate={{opacity:1,y:0}} exit={{opacity:0}} transition={{duration:0.22}}>
                <ProfileTab user={user} onLogout={handleLogout} />
              </motion.div>
            )}
          </AnimatePresence>

          <BottomNav active={activeTab} onChange={handleTabChange} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
